<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Store Admin — Poornima's Care</title>
<link rel="stylesheet" href="../css/main.css"/>
<script>window.PC_API_URL = "https://poornima-s-care.onrender.com";</script>
<script src="../js/embed-helper.js"></script>
<style>
.tog{position:relative;display:inline-block;width:36px;height:20px;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:20px;transition:.2s;}
.tog-sl:before{content:'';position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:var(--white);border-radius:50%;transition:.2s;}
.tog input:checked+.tog-sl{background:var(--teal);}
.tog input:checked+.tog-sl:before{transform:translateX(16px);}

</style>
</head><body>
<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div class="admin-wrap">
<div class="admin-sb">
  <div class="asb-top">
    <div class="asb-logo">Poornima's <span>Care</span></div>
    <div class="asb-av" id="tnAv">—</div>
    <div class="asb-nm" id="sbNm">—</div>
    <div class="asb-id" id="sbId">—</div>
  </div>
  
  <div class="asb-sec">Store</div>
  <div class="asb-link active" id="nl-orders" onclick="showView('orders',this)"><span class="asb-ic">📋</span> Orders</div>
  <div class="asb-link" id="nl-products" onclick="showView('products',this);loadProducts()"><span class="asb-ic">🏷️</span> Products</div>
  <div style="padding:14px 16px;margin-top:auto;border-top:1px solid rgba(184,227,233,.12);">
    <button class="btn-p full" style="font-size:11px;padding:8px;" onclick="signOut()">Sign Out</button>
  </div>
</div>
<div class="admin-main"><div class="page-body">
<div class="ftabs mb-3">
  <button class="ftab active" id="tb-store" onclick="switchType('store')">🛍️ PU Store</button>
  <button class="ftab" id="tb-stationery" onclick="switchType('stationery')">📚 PU Stationery</button>
</div>
<div id="v-orders" class="sec active">
  <div class="admin-hdr"><div class="admin-hdr-t" id="ordersTitle">📋 Store Orders</div><button class="btn-sec" onclick="loadOrders()">↻</button></div>
  <div class="admin-body">
    <div class="g4 mb-3">
      <div class="sc"><div class="sc-n" id="sTotal">—</div><div class="sc-l">Total</div></div>
      <div class="sc"><div class="sc-n" id="sPaid" style="color:#1a4f8a;">—</div><div class="sc-l">New</div></div>
      <div class="sc"><div class="sc-n" id="sProc" style="color:#e4a200;">—</div><div class="sc-l">Processing</div></div>
      <div class="sc"><div class="sc-n" id="sReady" style="color:var(--green);">—</div><div class="sc-l">Ready</div></div>
      <div class="sc"><div class="sc-n" id="sRevenue" style="color:var(--green);">—</div><div class="sc-l">Revenue ₹</div></div>
    </div>
    <div id="ordersList"><div class="empty"><div class="ei">📋</div><p>Loading…</p></div></div>
  </div>
</div>
<div id="v-products" class="sec">
  <div class="admin-hdr">
    <div class="admin-hdr-t" id="productsTitle">🏷️ Products</div>
    <div style="display:flex;gap:8px;">
      <button class="btn-sec" onclick="seedProducts()">🌱 Seed Default</button>
      <button class="btn-p" style="padding:8px 14px;font-size:12px;" onclick="showAddItem()">+ Add</button>
    </div>
  </div>
  <div class="admin-body" id="productsList"><div class="empty"><div class="ei">🏷️</div><p>Loading…</p></div></div>
</div>
</div>

<div id="addItemModal" class="modal-ov">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('addItemModal')">✕</button>
    <div class="modal-title" id="itemModalTitle">Add Product</div>
    <div class="flbl">Name <span class="req">*</span></div><input id="iName" class="finp" placeholder="Product name"/>
    <div class="flbl">Category <span class="req">*</span></div><input id="iCategory" class="finp" placeholder="e.g. T-Shirt, ID Card"/>
    <div class="flbl">Price (₹) <span class="req">*</span></div><input id="iPrice" type="number" class="finp" placeholder="0"/>
    <div class="flbl">Sizes (comma separated, leave blank if none)</div><input id="iSizes" class="finp" placeholder="S, M, L, XL, XXL"/>
    <div class="flbl">Emoji</div><input id="iEmoji" class="finp" placeholder="e.g. 👕"/>
    <div class="flbl">Description</div><input id="iDesc" class="finp" placeholder="Optional"/>
    <input type="hidden" id="iEditId"/>
    <button class="btn-p full" onclick="saveItem()">Save Product</button>
  </div>
</div></div>
</div>
<script src="../js/api.js"></script><script src="../js/features.js"></script>
<script>
const user=requireAuth(['store_admin','campus_admin','super_admin']);if(!user)throw new Error('auth');

document.getElementById('tnAv').textContent=user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
document.getElementById('sbNm').textContent=user.name;
document.getElementById('sbId').textContent=user.userId;
function toggleSidebar(){document.querySelector('.admin-sb').classList.toggle('open');document.querySelector('.sidebar-overlay').classList.toggle('active');}
function showView(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.asb-link').forEach(l=>l.classList.remove('active'));document.getElementById('v-'+id).classList.add('active');if(el)el.classList.add('active');}

let curType='store';
function switchType(t){
  curType=t;
  document.getElementById('tb-store').classList.toggle('active',t==='store');
  document.getElementById('tb-stationery').classList.toggle('active',t==='stationery');
  document.getElementById('ordersTitle').textContent=t==='store'?'📋 Store Orders':'📋 Stationery Orders';
  document.getElementById('productsTitle').textContent=t==='store'?'🏷️ Store Products':'🏷️ Stationery Products';
  if(document.getElementById('v-orders').classList.contains('active'))loadOrders();else loadProducts();
}
function showView(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.asb-link').forEach(l=>l.classList.remove('active'));document.getElementById('v-'+id).classList.add('active');if(el)el.classList.add('active');}
async function loadOrders(){
  try{
    const [sD,oD]=await Promise.all([apiFetch('/store/stats?type='+curType),apiFetch('/store/orders?type='+curType)]);
    const s=sD.stats;
    document.getElementById('sTotal').textContent=s.total;document.getElementById('sPaid').textContent=s.paid;
    document.getElementById('sProc').textContent=s.processing;document.getElementById('sReady').textContent=s.ready;
    document.getElementById('sRevenue').textContent='₹'+s.revenue;
    const orders=(oD.orders||[]).filter(o=>o.status!=='collected'&&o.status!=='cancelled');
    const el=document.getElementById('ordersList');
    if(!orders.length){el.innerHTML='<div class="empty"><div class="ei">✅</div><p>No active orders.</p></div>';return;}
    const stCls={paid:'badge-inprogress',processing:'badge-inprogress',ready:'badge-resolved'};
    const stLabel={paid:'💳 New',processing:'⚙️ Processing',ready:'✅ Ready!'};
    el.innerHTML=orders.map(o=>`
      <div class="card mb-2">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
          <div><div style="color:var(--teal);font-weight:800;letter-spacing:1px;">${o.orderId}</div><div style="color:var(--muted);font-size:10px;">${o.studentName} · ${o.studentUserId}</div></div>
          <span class="badge ${stCls[o.status]||''}">${stLabel[o.status]||o.status}</span>
        </div>
        ${o.idCardReason?`<div class="info-box" style="font-size:10px;margin-bottom:8px;">ID Card: ${o.idCardReason}</div>`:''}
        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;">${o.items.map(i=>`<span class="info-box" style="margin:0;padding:2px 7px;display:inline-block;font-size:10px;">${i.name}${i.size?' ('+i.size+')':''} ×${i.qty}</span>`).join('')}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="color:var(--green);font-weight:700;">₹${o.total}</span>
          <div style="display:flex;gap:6px;">
            ${o.status==='paid'?`<button class="btn-sm" style="background:#e4a200;border-color:#e4a200;color:var(--white);" onclick="updOrder('${o._id}','processing')">Process</button>`:''}
            ${o.status==='processing'?`<button class="btn-sm" style="background:var(--green);border-color:var(--green);color:var(--white);" onclick="updOrder('${o._id}','ready')">Ready</button>`:''}
            ${o.status==='ready'?`<button class="btn-sm" style="background:var(--teal);border-color:var(--teal);color:var(--white);" onclick="updOrder('${o._id}','collected')">Collected</button>`:''}
            <button class="btn-red" onclick="updOrder('${o._id}','cancelled')">✕</button>
          </div>
        </div>
      </div>`).join('');
  }catch(e){showToast(e.message,'error');}
}
async function updOrder(id,status){try{await apiFetch('/store/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});loadOrders();showToast('Updated','success');}catch(e){showToast(e.message,'error');}}
async function loadProducts(){
  const el=document.getElementById('productsList');el.innerHTML='<div class="empty"><div class="ei">⏳</div><p>Loading…</p></div>';
  try{
    const data=await apiFetch('/store/products?type='+curType);const items=data.products||[];
    if(!items.length){el.innerHTML='<div class="empty"><div class="ei">🏷️</div><p>No products yet. Click "Seed Default".</p></div>';return;}
    el.innerHTML=items.map(item=>`
      <div class="card mb-2 flex items-c gap-3" style="flex-wrap:wrap;">
        <span style="font-size:22px;">${item.imageEmoji||'🏷️'}</span>
        <div style="flex:1;min-width:140px;"><div style="font-weight:600;color:var(--navy);">${item.name}</div><div style="color:var(--muted);font-size:10px;">${item.category}${item.sizes?.length?' · '+item.sizes.join(', '):''}</div></div>
        <div style="color:var(--green);font-weight:700;">₹${item.price}</div>
        <label class="tog"><input type="checkbox" ${item.isAvailable?'checked':''} onchange="toggleAvail('${item._id}',this.checked)"/><span class="tog-sl"></span></label>
        <div style="display:flex;gap:5px;">
          <button class="btn-sm" onclick='editItem(${JSON.stringify(item).replace(/"/g,"&quot;")})'>Edit</button>
          <button class="btn-red" onclick="deleteItem('${item._id}','${item.name.replace(/'/g,"\'")}')">Del</button>
        </div>
      </div>`).join('');
  }catch(e){el.innerHTML=`<div class="empty"><div class="ei">⚠️</div><p>${e.message}</p></div>`;}
}
async function toggleAvail(id,val){try{await apiFetch('/store/products/'+id,{method:'PATCH',body:JSON.stringify({isAvailable:val})});showToast(val?'Enabled':'Disabled','success');}catch(e){showToast(e.message,'error');}}
function showAddItem(){['iName','iCategory','iPrice','iSizes','iEmoji','iDesc'].forEach(id=>document.getElementById(id).value='');document.getElementById('iEditId').value='';document.getElementById('itemModalTitle').textContent='Add Product';openModal('addItemModal');}
function editItem(item){document.getElementById('iName').value=item.name;document.getElementById('iCategory').value=item.category;document.getElementById('iPrice').value=item.price;document.getElementById('iSizes').value=(item.sizes||[]).join(', ');document.getElementById('iEmoji').value=item.imageEmoji||'';document.getElementById('iDesc').value=item.description||'';document.getElementById('iEditId').value=item._id;document.getElementById('itemModalTitle').textContent='Edit Product';openModal('addItemModal');}
async function saveItem(){
  const id=document.getElementById('iEditId').value;
  const sz=document.getElementById('iSizes').value.trim();
  const body={type:curType,name:document.getElementById('iName').value.trim(),category:document.getElementById('iCategory').value.trim(),price:+document.getElementById('iPrice').value,sizes:sz?sz.split(',').map(s=>s.trim()).filter(Boolean):[],imageEmoji:document.getElementById('iEmoji').value.trim()||'🏷️',description:document.getElementById('iDesc').value.trim()};
  if(!body.name||!body.category||!body.price)return showToast('Name, category and price required','warning');
  try{if(id)await apiFetch('/store/products/'+id,{method:'PATCH',body:JSON.stringify(body)});else await apiFetch('/store/products',{method:'POST',body:JSON.stringify(body)});closeModal('addItemModal');loadProducts();showToast('Saved!','success');}catch(e){showToast(e.message,'error');}
}
async function deleteItem(id,name){if(!confirm(`Delete "${name}"?`))return;try{await apiFetch('/store/products/'+id,{method:'DELETE'});loadProducts();showToast('Deleted','success');}catch(e){showToast(e.message,'error');}}
async function seedProducts(){if(!confirm('Seed default '+curType+' products?'))return;try{const d=await apiFetch('/store/products/seed?type='+curType,{method:'POST'});showToast(d.message,'success');loadProducts();}catch(e){showToast(e.message,'error');}}
loadOrders();setInterval(()=>{if(document.getElementById('v-orders').classList.contains('active'))loadOrders();},20000);
</script>
</body></html>
