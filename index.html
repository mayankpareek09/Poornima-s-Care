<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login — Poornima's Care</title>
<link rel="stylesheet" href="css/main.css"/>
<style>
*{box-sizing:border-box;}
body{background:linear-gradient(135deg,#0B2E33 0%,#1a4f58 50%,#0B2E33 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Sora',sans-serif;}
.login-wrap{width:100%;max-width:520px;}
.login-card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.login-top{background:#0B2E33;padding:36px 40px 30px;position:relative;overflow:hidden;}
.login-top::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;background:rgba(79,124,130,0.15);}
.logo-row{display:flex;align-items:center;gap:14px;margin-bottom:24px;position:relative;z-index:1;}
.logo-sq{width:46px;height:46px;background:linear-gradient(135deg,#4F7C82,#93B1B5);border-radius:14px;display:flex;align-items:center;justify-content:center;}
.logo-sq svg{width:22px;height:22px;fill:#fff;}
.logo-text{font-size:18px;font-weight:800;color:#B8E3E9;}
.logo-text span{color:#4F7C82;}
.hero-title{font-size:28px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:8px;position:relative;z-index:1;}
.hero-sub{font-size:13px;color:#93B1B5;position:relative;z-index:1;}
.login-body{padding:32px 40px 36px;}
.portal-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:24px;}
.ptab{padding:14px 6px;border-radius:12px;border:2px solid #B8E3E9;text-align:center;cursor:pointer;background:#f0fafb;transition:all .2s;}
.ptab:hover{border-color:#4F7C82;background:#e8f6f8;}
.ptab.active{background:#0B2E33;border-color:#0B2E33;box-shadow:0 4px 12px rgba(11,46,51,0.2);}
.ptab-ic{font-size:22px;display:block;margin-bottom:5px;}
.ptab-lb{font-size:11px;font-weight:700;color:#4F7C82;}
.ptab.active .ptab-lb{color:#B8E3E9;}
.council-sub{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.council-sub.show{display:grid;}
.csub{padding:12px;border-radius:11px;border:2px solid #B8E3E9;text-align:center;cursor:pointer;font-size:12px;font-weight:700;color:#4F7C82;background:#f0fafb;transition:all .2s;}
.csub.active{background:#4F7C82;border-color:#4F7C82;color:#fff;}
.flbl{font-size:12px;font-weight:700;color:#4F7C82;letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px;margin-top:4px;}
.finp{width:100%;border:2px solid #B8E3E9;border-radius:11px;padding:13px 16px;font-size:14px;color:#0B2E33;background:#f8fcfd;outline:none;margin-bottom:16px;font-family:'Sora',sans-serif;transition:border .2s;}
.finp:focus{border-color:#4F7C82;background:#fff;box-shadow:0 0 0 3px rgba(79,124,130,0.1);}
.login-err{color:#E24B4A;font-size:12px;margin-bottom:10px;min-height:18px;font-weight:600;}
.btn-login{width:100%;padding:15px;background:#0B2E33;border:none;border-radius:12px;color:#B8E3E9;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s;font-family:'Sora',sans-serif;}
.btn-login:hover{background:#0d3b42;transform:translateY(-1px);box-shadow:0 6px 20px rgba(11,46,51,0.3);}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.login-links{display:flex;justify-content:center;gap:20px;margin-top:20px;}
.login-links a{font-size:12px;color:#4F7C82;font-weight:600;cursor:pointer;transition:color .2s;}
.login-links a:hover{color:#0B2E33;}
@media (max-width: 768px){

  .portal-tabs { grid-template-columns: repeat(2, 1fr); }
.council-sub { grid-template-columns: 1fr 1fr; }
.ptab-ic { font-size: 18px; }
.login-body { padding: 20px 16px 24px; }
  .login-wrap{
    max-width:100%;
    padding:10px;
  }

  .login-top{
    padding:24px 20px 20px;
  }

  .login-body{
    padding:20px;
  }

  .hero-title{
    font-size:22px;
  }

  .portal-tabs{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .ptab{
    padding:12px 6px;
    font-size:12px;
  }

  .ptab-ic{
    font-size:18px;
  }

  .council-sub{
    grid-template-columns:1fr;
  }

  .finp{
    font-size:16px;
    padding:12px;
  }

  .btn-login{
    font-size:14px;
    padding:14px;
  }
}

@media (max-width:400px){
  .hero-title{
    font-size:18px;
  }

  .logo-text{
    font-size:16px;
  }

  .ptab-lb{
    font-size:10px;
  }
}
</style>
<script>window.PC_API_URL = "https://poornima-s-care.onrender.com";</script>
</head><body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-top">
      <div class="logo-row">
        <div class="logo-sq"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div>
        <div class="logo-text">Poornima's <span>Care</span></div>
      </div>
      <div class="hero-title">Welcome back.<br/>Sign in to continue.</div>
      <div class="hero-sub">Campus management portal · Session 2026-27</div>
    </div>
    <div class="login-body">
      <div class="portal-tabs">
        <div class="ptab active" id="pt-student" onclick="selectPortal('student')"><span class="ptab-ic">🎓</span><span class="ptab-lb">Student</span></div>
     <div class="ptab" id="pt-admin" onclick="selectPortal('admin')">
  <span class="ptab-ic">🔐</span>
  <span class="ptab-lb">Admin</span>
</div>
        <div class="ptab" id="pt-laundry_admin" onclick="selectPortal('laundry_admin')"><span class="ptab-ic">👕</span><span class="ptab-lb">Laundry</span></div>
        <div class="ptab" id="pt-council" onclick="selectPortal('council')"><span class="ptab-ic">👑</span><span class="ptab-lb">Council</span></div>
        <div class="ptab" id="pt-super" onclick="selectPortal('super')" style="display:none;"><span class="ptab-ic">⚡</span><span class="ptab-lb">Super Admin</span></div>
      </div>
      <div class="admin-sub" id="adminSub" style="display:none;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;">
  <div class="csub active" onclick="selectAdmin('academic_admin', this)">🎓 Academic Admin</div>
  <div class="csub" onclick="selectAdmin('hostel_admin', this)">🏠 Hostel Admin</div>
  <div class="csub" onclick="selectAdmin('campus_admin', this)">🏛️ Campus Admin</div>
</div>
      <div class="council-sub" id="councilSub">
        <div class="csub active" id="cs-chair" onclick="selectCouncil('council_admin','cs-chair')">👑 Chair / Co-Chair</div>
        <div class="csub" id="cs-captain" onclick="selectCouncil('club_captain','cs-captain')">🏫 Captain / VC</div>
      </div>
      <div class="flbl">Enrollment ID</div>
      <input class="finp" id="loginId" placeholder="e.g. PU2021CS045" autocomplete="username"/>
      <div class="flbl">Password</div>
      <input class="finp" id="loginPwd" type="password" placeholder="••••••••" autocomplete="current-password"/>
      <div class="login-err" id="loginErr"></div>
      <button class="btn-login" id="loginBtn" onclick="doLogin()">Sign In →</button>
      <div class="login-links">
        <a onclick="window.location.href='register.html'">New student? Register →</a>
      </div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
let role='student';
// Click logo 5 times quickly to reveal Super Admin tab
let logoClicks = 0, logoTimer;
document.querySelector('.logo-text').style.cursor = 'pointer';
document.querySelector('.logo-text').addEventListener('click', function(){
  logoClicks++;
  clearTimeout(logoTimer);
  logoTimer = setTimeout(() => { logoClicks = 0; }, 2000);
  if(logoClicks >= 5){
    logoClicks = 0;
    const tab = document.getElementById('pt-super');
    if(tab.style.display === 'none'){
      tab.style.display = 'block';
    } else {
      tab.style.display = 'none';
    }
  }
});
function selectPortal(p){
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  document.getElementById('pt-'+p).classList.add('active');

  if(p === 'admin'){
    role = 'academic_admin';
    document.getElementById('adminSub').style.display = 'grid';
  } else {
    document.getElementById('adminSub').style.display = 'none';
    if(p === 'council') role = 'council_admin';
    else if(p === 'super') role = 'super_admin';
    else if(p === 'canteen') role = 'canteen_admin';
    else if(p === 'mess') role = 'mess_admin';
    else role = p;
  }

  document.getElementById('councilSub').classList.toggle('show',p==='council');
  document.getElementById('loginErr').textContent='';
}
function selectAdmin(r, el){
  role = r;
  document.querySelectorAll('#adminSub .csub').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}
function selectCouncil(r, activeId){
  role = r;
  document.querySelectorAll('#councilSub .csub').forEach(t=>t.classList.remove('active'));
  document.getElementById(activeId).classList.add('active');
}
async function doLogin(){
  const id=document.getElementById('loginId').value.trim();
  const pwd=document.getElementById('loginPwd').value.trim();
  const err=document.getElementById('loginErr');
  err.textContent='';
  if(!id||!pwd){err.textContent='Please enter your ID and password.';return;}
  const btn=document.getElementById('loginBtn');
  btn.textContent = "Waking server... please wait ⏳";
btn.disabled = true;
let wakeMsg = setTimeout(() => {
  btn.textContent = "Still waking server... almost ready ⏳";
}, 5000);
  try{
     const API_URL = "https://poornima-s-care.onrender.com";

  const res = await fetch(API_URL + '/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      userId: id,
      password: pwd,
      role
    })
  });
    const data=await res.json();
    if(!data.success){
  err.textContent = data.message || "Login failed. Try again.";
  return;
}
    localStorage.setItem('pc_token',data.token);
    localStorage.setItem('pc_user',JSON.stringify(data.user));
const dest={student:'pages/student.html',academic_admin:'pages/academic-admin.html',hostel_admin:'pages/academic-admin.html',campus_admin:'pages/academic-admin.html',laundry_admin:'pages/laundry-admin.html',council_admin:'pages/council-portal.html',club_captain:'pages/council-portal.html',vice_captain:'pages/council-portal.html',super_admin:'pages/super-admin.html',canteen_admin:'pages/canteen-admin.html',mess_admin:'pages/mess-admin.html'};
    window.location.href=dest[data.user.role]||'pages/student.html';
  }catch(e){err.textContent='Cannot connect to server. Check backend is running.';}
  finally{
  clearTimeout(wakeMsg);
  btn.textContent='Sign In →';
  btn.disabled=false;
}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
<script src="/js/features.js"></script>
</body></html>
