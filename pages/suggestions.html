<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Suggestions — Poornima's Care</title>
<link rel="stylesheet" href="../css/main.css"/>
<script>window.PC_API_URL = "https://poornima-s-care.onrender.com";</script>
<script src="../js/embed-helper.js"></script>
<style>
.tog{position:relative;display:inline-block;width:36px;height:20px;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:20px;transition:.2s;}
.tog-sl:before{content:'';position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:var(--white);border-radius:50%;transition:.2s;}
.tog input:checked+.tog-sl{background:var(--teal);}
.tog input:checked+.tog-sl:before{transform:translateX(16px);}

.sg-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;}
.sg-title{color:var(--navy);font-weight:700;font-size:14px;margin-bottom:3px;}
.sg-meta{color:var(--muted);font-size:10px;margin-bottom:8px;}
.sg-desc{color:var(--teal);font-size:12px;line-height:1.5;margin-bottom:10px;}
.vote-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--inp-bg);color:var(--navy);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.vote-btn.liked{background:#e0f2ee;border-color:var(--green);color:var(--green);}
.vote-btn.disliked{background:#fbe8e8;border-color:#A32D2D;color:#A32D2D;}
.sg-status{padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;}
.st-open{background:#e8f4ff;color:#1a4f8a;}
.st-under_review{background:#fff8e0;color:#633806;}
.st-implemented{background:#e0f2ee;color:var(--green);}
.st-rejected{background:#fbe8e8;color:#A32D2D;}

</style>
</head><body>
<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div class="admin-wrap">
<div class="admin-sb">
  <div class="asb-top">
    <div class="asb-logo">Poornima's <span>Care</span></div>
    <div class="asb-av" id="tnAv">—</div>
    <div class="asb-nm" id="sbNm">—</div>
    <div class="asb-id" id="sbId">—</div>
  </div>
  
  <div class="asb-sec">Community</div>
  <div class="asb-link active"><span class="asb-ic">💡</span> Suggestion Wall</div>
  <div class="asb-sec">Navigate</div>
  <div class="asb-link" onclick="pcGoToPortalHome()"><span class="asb-ic">🏠</span> Back to Portal</div>
  <div class="asb-link" onclick="pcNavigate('feedback.html')"><span class="asb-ic">⭐</span> Feedback</div>
  <div style="padding:14px 16px;margin-top:auto;border-top:1px solid rgba(184,227,233,.12);">
    <button class="btn-p full" style="font-size:11px;padding:8px;" onclick="signOut()">Sign Out</button>
  </div>
</div>
<div class="admin-main"><div class="page-body">
<div class="admin-hdr" style="justify-content:space-between;">
  <div class="admin-hdr-t">💡 Suggestion Wall</div>
  <button class="btn-p" style="padding:8px 16px;font-size:12px;" onclick="openModal('addModal')">+ New Suggestion</button>
</div>
<div class="admin-body">
  <div class="ftabs mb-3">
    <button class="ftab active" id="sort-top" onclick="setSort('top')">🔥 Top Voted</button>
    <button class="ftab" id="sort-recent" onclick="setSort('recent')">🕐 Most Recent</button>
    <select id="catFilter" class="fsel" style="margin:0;width:auto;padding:5px 10px;" onchange="loadSuggestions()">
      <option value="">All Categories</option>
      <option>Hostel</option><option>Mess</option><option>Academic</option><option>Canteen</option>
      <option>Bus</option><option>Cleanliness</option><option>Library</option><option>Sports</option>
      <option>Internet</option><option>Security</option><option>Administration</option><option>Events</option><option>Other</option>
    </select>
  </div>
  <div id="suggestionsList"><div class="empty"><div class="ei">💡</div><p>Loading…</p></div></div>
</div>

<div id="addModal" class="modal-ov">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('addModal')">✕</button>
    <div class="modal-title">💡 New Suggestion</div>
    <div class="modal-sub">Share an idea to improve campus life</div>
    <div class="flbl">Title <span class="req">*</span></div>
    <input id="sgTitle" class="finp" placeholder="Suggestion title"/>
    <div class="flbl">Category</div>
    <select id="sgCategory" class="fsel">
      <option>Hostel</option><option>Mess</option><option>Academic</option><option>Canteen</option>
      <option>Bus</option><option>Cleanliness</option><option>Library</option><option>Sports</option>
      <option>Internet</option><option>Security</option><option>Administration</option><option>Events</option><option>Other</option>
    </select>
    <div class="flbl">Description <span class="req">*</span></div>
    <textarea id="sgDesc" class="ftxt" placeholder="Describe your suggestion in detail..."></textarea>
    <label style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:16px;cursor:pointer;">
      <input type="checkbox" id="sgAnon" style="accent-color:var(--teal);"/> Post anonymously
    </label>
    <button class="btn-p full" onclick="postSuggestion()">Post Suggestion</button>
  </div>
</div>
</div></div>
</div>
<script src="../js/api.js"></script><script src="../js/features.js"></script>
<script>
const user=requireAuth(['student','academic_admin','hostel_admin','campus_admin','laundry_admin','canteen_admin','mess_admin','store_admin','super_admin','faculty','guard']);
if(!user)throw new Error('auth');
const ADMIN_ROLES=['academic_admin','hostel_admin','campus_admin','super_admin'];
const isAdmin=ADMIN_ROLES.includes(user.role);

document.getElementById('tnAv').textContent=user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
document.getElementById('sbNm').textContent=user.name;
document.getElementById('sbId').textContent=user.userId;
function toggleSidebar(){document.querySelector('.admin-sb').classList.toggle('open');document.querySelector('.sidebar-overlay').classList.toggle('active');}
function showView(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.asb-link').forEach(l=>l.classList.remove('active'));document.getElementById('v-'+id).classList.add('active');if(el)el.classList.add('active');}

let currentSort='top';
function setSort(s){currentSort=s;document.getElementById('sort-top').classList.toggle('active',s==='top');document.getElementById('sort-recent').classList.toggle('active',s==='recent');loadSuggestions();}
async function postSuggestion(){
  const title=document.getElementById('sgTitle').value.trim();
  const description=document.getElementById('sgDesc').value.trim();
  const category=document.getElementById('sgCategory').value;
  const isAnonymous=document.getElementById('sgAnon').checked;
  if(!title||!description)return showToast('Title and description required','warning');
  try{await apiFetch('/suggestions',{method:'POST',body:JSON.stringify({title,description,category,isAnonymous})});closeModal('addModal');showToast('Suggestion posted!','success');loadSuggestions();}
  catch(e){showToast(e.message,'error');}
}
async function loadSuggestions(){
  const el=document.getElementById('suggestionsList');el.innerHTML='<div class="empty"><div class="ei">⏳</div><p>Loading…</p></div>';
  try{
    const cat=document.getElementById('catFilter').value;
    let url='/suggestions?sort='+currentSort;if(cat)url+='&category='+cat;
    const data=await apiFetch(url);const suggestions=data.suggestions||[];
    if(!suggestions.length){el.innerHTML='<div class="empty"><div class="ei">💡</div><p>No suggestions yet. Be the first!</p></div>';return;}
    const stLabel={open:'Open',under_review:'Under Review',implemented:'Implemented',rejected:'Rejected'};
    el.innerHTML=suggestions.map(s=>`
      <div class="sg-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px;margin-bottom:4px;">
          <div class="sg-title">${s.title}</div>
          <div style="display:flex;gap:6px;align-items:center;">
            <span class="badge" style="background:var(--inp-bg);color:var(--muted);font-size:10px;">${s.category}</span>
            <span class="sg-status st-${s.status}">${stLabel[s.status]}</span>
            ${isAdmin?`<select onchange="updateStatus('${s._id}',this.value)" class="fsel" style="margin:0;padding:3px 6px;width:auto;font-size:10px;">
              <option value="open" ${s.status==='open'?'selected':''}>Open</option>
              <option value="under_review" ${s.status==='under_review'?'selected':''}>Under Review</option>
              <option value="implemented" ${s.status==='implemented'?'selected':''}>Implemented</option>
              <option value="rejected" ${s.status==='rejected'?'selected':''}>Rejected</option>
            </select>`:''}
          </div>
        </div>
        <div class="sg-meta">by ${s.authorName} · ${new Date(s.createdAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</div>
        <div class="sg-desc">${s.description}</div>
        ${s.adminNote?`<div class="info-box" style="font-size:11px;margin-bottom:10px;">📝 Admin: ${s.adminNote}</div>`:''}
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <button class="vote-btn ${s.userVote==='like'?'liked':''}" onclick="vote('${s._id}','like')">👍 ${s.likeCount}</button>
          <button class="vote-btn ${s.userVote==='dislike'?'disliked':''}" onclick="vote('${s._id}','dislike')">👎 ${s.dislikeCount}</button>
          <span style="font-size:12px;font-weight:700;color:${s.score>0?'var(--green)':s.score<0?'#A32D2D':'var(--muted)'};">Score: ${s.score>0?'+':''}${s.score}</span>
        </div>
      </div>`).join('');
  }catch(e){el.innerHTML=`<div class="empty"><div class="ei">⚠️</div><p>${e.message}</p></div>`;}
}
async function vote(id,type){try{await apiFetch('/suggestions/'+id+'/vote',{method:'PATCH',body:JSON.stringify({vote:type})});loadSuggestions();}catch(e){showToast(e.message,'error');}}
async function updateStatus(id,status){try{await apiFetch('/suggestions/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});showToast('Status updated','success');loadSuggestions();}catch(e){showToast(e.message,'error');}}
loadSuggestions();
</script>
</body></html>
