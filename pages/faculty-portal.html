<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Faculty Portal — Poornima's Care</title>
<link rel="stylesheet" href="../css/main.css"/>
<script>window.PC_API_URL = "https://poornima-s-care.onrender.com";</script>
<script src="../js/embed-helper.js"></script>
<style>
.tog{position:relative;display:inline-block;width:36px;height:20px;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:20px;transition:.2s;}
.tog-sl:before{content:'';position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:var(--white);border-radius:50%;transition:.2s;}
.tog input:checked+.tog-sl{background:var(--teal);}
.tog input:checked+.tog-sl:before{transform:translateX(16px);}

.slot-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center;}
.slot-row select,.slot-row input{border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--navy);background:var(--inp-bg);font-family:'Sora',sans-serif;outline:none;}
.slot-row select:focus,.slot-row input:focus{border-color:var(--teal);}

</style>
</head><body>
<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div class="admin-wrap">
<div class="admin-sb">
  <div class="asb-top">
    <div class="asb-logo">Poornima's <span>Care</span></div>
    <div class="asb-av" id="tnAv">—</div>
    <div class="asb-nm" id="sbNm">—</div>
    <div class="asb-id" id="sbId">—</div>
  </div>
  
  <div class="asb-sec">Appointments</div>
  <div class="asb-link active" id="nl-requests" onclick="showView('requests',this)"><span class="asb-ic">📥</span> Requests</div>
  <div class="asb-link" id="nl-availability" onclick="showView('availability',this);loadProfile()"><span class="asb-ic">🗓️</span> My Availability</div>
  <div style="padding:14px 16px;margin-top:auto;border-top:1px solid rgba(184,227,233,.12);">
    <button class="btn-p full" style="font-size:11px;padding:8px;" onclick="signOut()">Sign Out</button>
  </div>
</div>
<div class="admin-main"><div class="page-body">
<div id="v-requests" class="sec active">
  <div class="admin-hdr"><div class="admin-hdr-t">📥 Appointment Requests</div><button class="btn-sec" onclick="loadRequests()">↻</button></div>
  <div class="admin-body" id="requestsList"><div class="empty"><div class="ei">📥</div><p>Loading…</p></div></div>
</div>
<div id="v-availability" class="sec">
  <div class="admin-hdr"><div class="admin-hdr-t">🗓️ My Availability</div></div>
  <div class="admin-body">
    <div class="card">
      <div class="frow mb-2">
        <div><div class="flbl">Department</div><input id="fDept" class="finp" placeholder="e.g. Computer Science"/></div>
        <div><div class="flbl">Designation</div><input id="fDesignation" class="finp" placeholder="e.g. Assistant Professor"/></div>
      </div>
      <div class="sec-lbl mb-2">WEEKLY AVAILABLE SLOTS</div>
      <div id="slotsContainer"></div>
      <button class="btn-sec mb-3" onclick="addSlotRow()">+ Add Slot</button>
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:16px;cursor:pointer;">
        <input type="checkbox" id="fAccepting" checked style="accent-color:var(--teal);"/> Currently accepting appointments
      </label>
      <button class="btn-p full" onclick="saveProfile()">Save Availability</button>
    </div>
  </div>
</div>
</div>

<div id="rejectModal" class="modal-ov">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('rejectModal')">✕</button>
    <div class="modal-title">Reason for Rejection</div>
    <div class="modal-sub">Optional — let the student know why.</div>
    <textarea id="rejectReason" class="ftxt" placeholder="Enter reason (optional)..."></textarea>
    <div style="display:flex;gap:10px;">
      <button class="btn-sec" style="flex:1;" onclick="closeModal('rejectModal')">Cancel</button>
      <button class="btn-p" style="flex:2;background:var(--red);border:none;" onclick="confirmReject()">Confirm Reject</button>
    </div>
  </div>
</div></div>
</div>
<script src="../js/api.js"></script><script src="../js/features.js"></script>
<script>
const user=requireAuth(['faculty']);if(!user)throw new Error('auth');

document.getElementById('tnAv').textContent=user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
document.getElementById('sbNm').textContent=user.name;
document.getElementById('sbId').textContent=user.userId;
function toggleSidebar(){document.querySelector('.admin-sb').classList.toggle('open');document.querySelector('.sidebar-overlay').classList.toggle('active');}
function showView(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.asb-link').forEach(l=>l.classList.remove('active'));document.getElementById('v-'+id).classList.add('active');if(el)el.classList.add('active');}

let rejectingId=null,slotCount=0;
function addSlotRow(day,start,end){
  slotCount++;const id='slot-'+slotCount;const div=document.createElement('div');div.className='slot-row';div.id=id;
  div.innerHTML=`<select class="slot-day"><option value="Mon" ${day==='Mon'?'selected':''}>Monday</option><option value="Tue" ${day==='Tue'?'selected':''}>Tuesday</option><option value="Wed" ${day==='Wed'?'selected':''}>Wednesday</option><option value="Thu" ${day==='Thu'?'selected':''}>Thursday</option><option value="Fri" ${day==='Fri'?'selected':''}>Friday</option><option value="Sat" ${day==='Sat'?'selected':''}>Saturday</option></select>
    <input class="slot-start" placeholder="Start e.g. 10:00 AM" value="${start||''}"/>
    <input class="slot-end" placeholder="End e.g. 11:00 AM" value="${end||''}"/>
    <button class="btn-red" onclick="document.getElementById('${id}').remove()">✕</button>`;
  document.getElementById('slotsContainer').appendChild(div);
}
async function loadProfile(){
  try{
    const data=await apiFetch('/appointments/faculty/profile/my');
    document.getElementById('slotsContainer').innerHTML='';
    if(data.profile){
      document.getElementById('fDept').value=data.profile.department||'';
      document.getElementById('fDesignation').value=data.profile.designation||'';
      document.getElementById('fAccepting').checked=data.profile.isAcceptingAppointments!==false;
      (data.profile.availableSlots||[]).forEach(s=>addSlotRow(s.day,s.startTime,s.endTime));
    }
    if(!document.getElementById('slotsContainer').children.length)addSlotRow();
  }catch(e){addSlotRow();}
}
async function saveProfile(){
  const slots=Array.from(document.querySelectorAll('.slot-row')).map(row=>({day:row.querySelector('.slot-day').value,startTime:row.querySelector('.slot-start').value.trim(),endTime:row.querySelector('.slot-end').value.trim()})).filter(s=>s.startTime&&s.endTime);
  try{
    await apiFetch('/appointments/faculty/profile',{method:'POST',body:JSON.stringify({department:document.getElementById('fDept').value.trim(),designation:document.getElementById('fDesignation').value.trim(),availableSlots:slots,isAcceptingAppointments:document.getElementById('fAccepting').checked})});
    showToast('Availability saved!','success');
  }catch(e){showToast(e.message,'error');}
}
async function loadRequests(){
  const el=document.getElementById('requestsList');el.innerHTML='<div class="empty"><div class="ei">⏳</div><p>Loading…</p></div>';
  try{
    const data=await apiFetch('/appointments/requests');const appts=data.appointments||[];
    if(!appts.length){el.innerHTML='<div class="empty"><div class="ei">📥</div><p>No appointment requests yet.</p></div>';return;}
    const stCls={pending:'badge-inprogress',accepted:'badge-resolved',rejected:'badge-red',cancelled:'badge-gold'};
    const stLabel={pending:'⏳ Pending',accepted:'✅ Accepted',rejected:'❌ Rejected',cancelled:'🚫 Cancelled'};
    el.innerHTML=appts.map(a=>`
      <div class="card mb-2">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
          <div><div style="font-weight:700;color:var(--navy);">${a.studentName} <span style="color:var(--muted);font-weight:400;font-size:11px;">(${a.studentUserId})</span></div><div style="color:var(--muted);font-size:10px;">${a.day}, ${a.date} · ${a.timeSlot}</div></div>
          <span class="badge ${stCls[a.status]||''}">${stLabel[a.status]||a.status}</span>
        </div>
        <div style="color:var(--teal);font-size:12px;margin-bottom:8px;">"${a.reason}"</div>
        ${a.facultyResponse?`<div class="info-box" style="font-size:11px;margin-bottom:8px;">Your response: ${a.facultyResponse}</div>`:''}
        ${a.status==='pending'?`<div style="display:flex;gap:8px;"><button class="btn-p" style="flex:1;padding:9px;font-size:12px;" onclick="acceptAppt('${a._id}')">✅ Accept</button><button class="btn-red" style="flex:1;padding:9px;font-size:12px;" onclick="openRejectModal('${a._id}')">❌ Reject</button></div>`:''}
      </div>`).join('');
  }catch(e){el.innerHTML=`<div class="empty"><div class="ei">⚠️</div><p>${e.message}</p></div>`;}
}
async function acceptAppt(id){try{await apiFetch('/appointments/'+id,{method:'PATCH',body:JSON.stringify({status:'accepted'})});loadRequests();showToast('Accepted','success');}catch(e){showToast(e.message,'error');}}
function openRejectModal(id){rejectingId=id;document.getElementById('rejectReason').value='';openModal('rejectModal');}
async function confirmReject(){
  try{await apiFetch('/appointments/'+rejectingId,{method:'PATCH',body:JSON.stringify({status:'rejected',facultyResponse:document.getElementById('rejectReason').value.trim()})});closeModal('rejectModal');loadRequests();showToast('Rejected','success');}
  catch(e){showToast(e.message,'error');}
}
loadRequests();
</script>
</body></html>
