<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Suggestions — Poornima's Care</title>
<link rel="stylesheet" href="../css/main.css"/>
<script>window.PC_API_URL = "https://poornima-s-care.onrender.com";</script>
<style>
.sg-header{background:linear-gradient(135deg,#0B2E33,#1A3A1A);padding:28px 32px;border-radius:16px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.sg-header h1{color:#fff;font-size:22px;margin:0;}
.sg-header p{color:#93B1B5;font-size:12px;margin:4px 0 0;}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
.filter-bar select,.sort-btn{background:#1A3A40;border:1px solid rgba(184,227,233,.2);color:#D0EEF2;padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;}
.sort-btn.active{background:#27AE60;border-color:#27AE60;}
.sg-card{background:#112D32;border:1px solid rgba(184,227,233,.12);border-radius:14px;padding:18px;margin-bottom:12px;}
.sg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.sg-title{color:#D0EEF2;font-weight:700;font-size:15px;}
.sg-meta{color:#93B1B5;font-size:11px;margin-top:3px;}
.sg-desc{color:#B8E3E9;font-size:13px;line-height:1.5;margin-bottom:12px;}
.sg-cat{padding:2px 9px;border-radius:5px;font-size:10px;font-weight:700;background:rgba(184,227,233,.1);color:#93B1B5;}
.sg-status{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;}
.st-open{background:#2980B922;color:#2980B9;}
.st-under_review{background:#e67e2222;color:#e67e22;}
.st-implemented{background:#27AE6022;color:#27AE60;}
.st-rejected{background:#e74c3c22;color:#e74c3c;}
.vote-row{display:flex;gap:10px;align-items:center;}
.vote-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid rgba(184,227,233,.2);background:rgba(184,227,233,.05);color:#93B1B5;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.vote-btn.liked{background:#27AE6022;border-color:#27AE60;color:#27AE60;}
.vote-btn.disliked{background:#e74c3c22;border-color:#e74c3c;color:#e74c3c;}
.score-badge{font-weight:800;font-size:14px;}
.fab-add{position:fixed;bottom:28px;right:28px;z-index:999;background:#27AE60;color:#fff;border:none;border-radius:50px;padding:14px 24px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 24px rgba(39,174,96,.4);}
</style>
</head>
<body>
<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div class="admin-wrap">
<div class="admin-sb">
  <div class="asb-top">
    <div class="asb-logo">Poornima's <span>Care</span></div>
    <div class="asb-av" id="tnAv">—</div>
    <div class="asb-nm" id="sbNm">—</div>
    <div class="asb-id" id="sbId">—</div>
  </div>
  <div class="asb-sec">Community</div>
  <div class="asb-link active"><span class="asb-ic">💡</span> Suggestion Wall</div>
  <div class="asb-sec">Navigate</div>
  <div class="asb-link" onclick="window.location.href='student.html'"><span class="asb-ic">🏠</span> Back to Portal</div>
  <div class="asb-link" onclick="window.location.href='feedback.html'"><span class="asb-ic">⭐</span> Feedback</div>
  <div style="padding:14px 16px;margin-top:auto;border-top:1px solid rgba(184,227,233,.12);">
    <button class="btn-p" style="width:100%;font-size:11px;padding:7px;" onclick="signOut()">Sign Out</button>
  </div>
</div>
<div class="admin-main">
<div class="page-body">

<div class="sg-header">
  <div>
    <h1>💡 Suggestion Wall</h1>
    <p>Share ideas to improve campus life — vote on what matters most</p>
  </div>
</div>

<div class="filter-bar">
  <button class="sort-btn active" id="sort-top" onclick="setSort('top')">🔥 Top Voted</button>
  <button class="sort-btn" id="sort-recent" onclick="setSort('recent')">🕐 Most Recent</button>
  <select id="catFilter" onchange="loadSuggestions()">
    <option value="">All Categories</option>
    <option value="Hostel">Hostel</option>
    <option value="Mess">Mess</option>
    <option value="Academic">Academic</option>
    <option value="Canteen">Canteen</option>
    <option value="Bus">Bus</option>
    <option value="Cleanliness">Cleanliness</option>
    <option value="Library">Library</option>
    <option value="Sports">Sports</option>
    <option value="Internet">Internet</option>
    <option value="Security">Security</option>
    <option value="Administration">Administration</option>
    <option value="Events">Events</option>
    <option value="Other">Other</option>
  </select>
</div>

<div id="suggestionsList"><div style="color:#93B1B5;font-size:13px;">Loading…</div></div>

</div></div></div>

<button class="fab-add" onclick="openAddModal()">+ New Suggestion</button>

<!-- ADD SUGGESTION MODAL -->
<div id="addModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:20px;">
  <div style="background:#0B2E33;border:1px solid rgba(184,227,233,.15);border-radius:16px;padding:28px;max-width:460px;width:100%;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
      <h3 style="color:#D0EEF2;margin:0;">💡 New Suggestion</h3>
      <button onclick="closeAddModal()" style="background:none;border:none;color:#93B1B5;font-size:20px;cursor:pointer;">✕</button>
    </div>
    <input id="sgTitle" placeholder="Suggestion title*" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(184,227,233,.2);color:#D0EEF2;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;"/>
    <select id="sgCategory" style="width:100%;box-sizing:border-box;background:#1A3A40;border:1px solid rgba(184,227,233,.2);color:#D0EEF2;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;">
      <option>Hostel</option><option>Mess</option><option>Academic</option><option>Canteen</option>
      <option>Bus</option><option>Cleanliness</option><option>Library</option><option>Sports</option>
      <option>Internet</option><option>Security</option><option>Administration</option><option>Events</option><option>Other</option>
    </select>
    <textarea id="sgDesc" placeholder="Describe your suggestion in detail*" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(184,227,233,.2);color:#D0EEF2;padding:10px 12px;border-radius:8px;font-size:13px;min-height:100px;resize:vertical;margin-bottom:12px;"></textarea>
    <label style="display:flex;align-items:center;gap:8px;color:#93B1B5;font-size:12px;margin-bottom:18px;cursor:pointer;">
      <input type="checkbox" id="sgAnon" style="accent-color:#27AE60;"/> Post anonymously
    </label>
    <button class="btn-p" style="width:100%;padding:12px;" onclick="postSuggestion()">Post Suggestion</button>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/features.js"></script>
<script>
const user = requireAuth(['student','academic_admin','hostel_admin','campus_admin','laundry_admin','canteen_admin','mess_admin','store_admin','super_admin','faculty','guard']);
if(!user) throw new Error('not auth');

const ADMIN_ROLES = ['academic_admin','hostel_admin','campus_admin','super_admin'];
const isAdmin = ADMIN_ROLES.includes(user.role);

document.getElementById('tnAv').textContent=user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
document.getElementById('sbNm').textContent=user.name;

let currentSort='top';

function toggleSidebar(){
  document.querySelector('.admin-sb').classList.toggle('open');
  document.querySelector('.sidebar-overlay').classList.toggle('active');
}

function setSort(s){
  currentSort=s;
  document.getElementById('sort-top').classList.toggle('active', s==='top');
  document.getElementById('sort-recent').classList.toggle('active', s==='recent');
  loadSuggestions();
}

function openAddModal(){
  document.getElementById('sgTitle').value='';
  document.getElementById('sgDesc').value='';
  document.getElementById('sgAnon').checked=false;
  document.getElementById('addModal').style.display='flex';
}
function closeAddModal(){ document.getElementById('addModal').style.display='none'; }

async function postSuggestion(){
  const title = document.getElementById('sgTitle').value.trim();
  const description = document.getElementById('sgDesc').value.trim();
  const category = document.getElementById('sgCategory').value;
  const isAnonymous = document.getElementById('sgAnon').checked;
  if(!title || !description) return showToast('Title and description required','warning');
  try{
    await apiFetch('/suggestions',{method:'POST',body:JSON.stringify({title,description,category,isAnonymous})});
    closeAddModal();
    showToast('Suggestion posted!','success');
    loadSuggestions();
  }catch(e){ showToast(e.message,'error'); }
}

async function loadSuggestions(){
  const el = document.getElementById('suggestionsList');
  el.innerHTML = '<div style="color:#93B1B5;font-size:13px;">Loading…</div>';
  try{
    const cat = document.getElementById('catFilter').value;
    let url = '/suggestions?sort='+currentSort;
    if(cat) url += '&category='+cat;
    const data = await apiFetch(url);
    const suggestions = data.suggestions || [];
    if(!suggestions.length){ el.innerHTML='<div style="color:#93B1B5;text-align:center;padding:40px;">No suggestions yet. Be the first to share an idea!</div>'; return; }

    const statusLabel = {open:'Open',under_review:'Under Review',implemented:'Implemented',rejected:'Rejected'};

    el.innerHTML = suggestions.map(s => {
      const adminControls = isAdmin ? `
        <select onchange="updateStatus('${s._id}',this.value)" style="background:#1A3A40;border:1px solid rgba(184,227,233,.2);color:#D0EEF2;padding:5px 8px;border-radius:6px;font-size:11px;margin-left:8px;">
          <option value="open" ${s.status==='open'?'selected':''}>Open</option>
          <option value="under_review" ${s.status==='under_review'?'selected':''}>Under Review</option>
          <option value="implemented" ${s.status==='implemented'?'selected':''}>Implemented</option>
          <option value="rejected" ${s.status==='rejected'?'selected':''}>Rejected</option>
        </select>` : '';

      return `<div class="sg-card">
        <div class="sg-top">
          <div>
            <div class="sg-title">${s.title}</div>
            <div class="sg-meta">by ${s.authorName} · ${new Date(s.createdAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="sg-cat">${s.category}</span>
            <span class="sg-status st-${s.status}">${statusLabel[s.status]}</span>
            ${adminControls}
          </div>
        </div>
        <div class="sg-desc">${s.description}</div>
        ${s.adminNote?`<div style="background:rgba(184,227,233,.05);border-left:3px solid #1A7A82;border-radius:6px;padding:8px 12px;margin-bottom:12px;color:#93B1B5;font-size:12px;">📝 Admin: ${s.adminNote}</div>`:''}
        <div class="vote-row">
          <button class="vote-btn ${s.userVote==='like'?'liked':''}" onclick="vote('${s._id}','like')">👍 ${s.likeCount}</button>
          <button class="vote-btn ${s.userVote==='dislike'?'disliked':''}" onclick="vote('${s._id}','dislike')">👎 ${s.dislikeCount}</button>
          <span class="score-badge" style="color:${s.score>0?'#27AE60':s.score<0?'#e74c3c':'#93B1B5'};">Score: ${s.score>0?'+':''}${s.score}</span>
        </div>
      </div>`;
    }).join('');
  }catch(e){ el.innerHTML = `<div style="color:#e74c3c;">${e.message}</div>`; }
}

async function vote(id, type){
  try{
    await apiFetch('/suggestions/'+id+'/vote',{method:'PATCH',body:JSON.stringify({vote:type})});
    loadSuggestions();
  }catch(e){ showToast(e.message,'error'); }
}

async function updateStatus(id, status){
  try{
    await apiFetch('/suggestions/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});
    showToast('Status updated','success');
    loadSuggestions();
  }catch(e){ showToast(e.message,'error'); }
}

loadSuggestions();
</script>
</body></html>
