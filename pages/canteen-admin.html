<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Canteen Admin — Poornima's Care</title>
<link rel="stylesheet" href="../css/main.css"/>
<script>window.PC_API_URL = "https://poornima-s-care.onrender.com";</script>
<style>
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:24px;}
.stat-c{background:#112D32;border:1px solid rgba(184,227,233,.12);border-radius:12px;padding:16px;text-align:center;}
.stat-n{font-size:28px;font-weight:900;margin-bottom:4px;}
.stat-l{color:#93B1B5;font-size:11px;font-weight:600;}
.queue-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.q-card{background:#112D32;border:1px solid rgba(184,227,233,.12);border-radius:14px;padding:18px;}
.q-token{font-size:18px;font-weight:900;letter-spacing:2px;color:#1A7A82;margin-bottom:6px;}
.q-name{color:#D0EEF2;font-weight:600;font-size:14px;}
.q-items{margin:10px 0;display:flex;flex-wrap:wrap;gap:5px;}
.q-item-pill{background:rgba(184,227,233,.08);border:1px solid rgba(184,227,233,.12);border-radius:5px;padding:2px 8px;font-size:11px;color:#D0EEF2;}
.q-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.q-btn{flex:1;padding:8px 4px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-prep{background:#e67e22;color:#fff;}
.btn-ready{background:#27AE60;color:#fff;}
.btn-collect{background:#1A7A82;color:#fff;}
.btn-cancel{background:rgba(231,76,60,.15);color:#e74c3c;border:1px solid rgba(231,76,60,.3);}
.col-paid{border-left:3px solid #2980B9;}
.col-preparing{border-left:3px solid #e67e22;}
.col-ready{border-left:3px solid #27AE60;}
.tog{position:relative;display:inline-block;width:36px;height:20px;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;cursor:pointer;inset:0;background:#333;border-radius:20px;transition:.2s;}
.tog-sl:before{content:'';position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
.tog input:checked+.tog-sl{background:#1A7A82;}
.tog input:checked+.tog-sl:before{transform:translateX(16px);}
</style>
</head>
<body>
<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div class="admin-wrap">
<div class="admin-sb">
  <div class="asb-top">
    <div class="asb-logo">Poornima's <span>Care</span></div>
    <div class="asb-av" id="tnAv">—</div>
    <div class="asb-nm" id="sbNm">—</div>
    <div class="asb-id" id="sbId">Canteen Admin</div>
  </div>
  <div class="asb-sec">Canteen</div>
  <div class="asb-link active" id="nl-queue"   onclick="showView('queue',this)"><span class="asb-ic">📋</span> Live Queue</div>
  <div class="asb-link"        id="nl-menu"    onclick="showView('menu',this)"><span class="asb-ic">🍽️</span> Manage Menu</div>
  <div class="asb-link"        id="nl-history" onclick="showView('history',this)"><span class="asb-ic">📊</span> Order History</div>
  <div style="padding:14px 16px;margin-top:auto;border-top:1px solid rgba(184,227,233,.12);">
    <button class="btn-p" style="width:100%;font-size:11px;padding:7px;" onclick="signOut()">Sign Out</button>
  </div>
</div>
<div class="admin-main">
<div class="page-body">

<!-- LIVE QUEUE -->
<div id="v-queue" class="sec active">
  <div class="admin-hdr">
    <div class="admin-hdr-t">📋 Live Queue <span style="font-size:11px;color:#27AE60;font-weight:400;">● Auto-refreshes every 15s</span></div>
    <button class="btn-p" style="font-size:11px;padding:7px 14px;" onclick="loadQueue()">↻ Refresh</button>
  </div>
  <div class="stat-row">
    <div class="stat-c"><div class="stat-n" id="sTotal"   style="color:#D0EEF2;">—</div><div class="stat-l">Total Today</div></div>
    <div class="stat-c"><div class="stat-n" id="sPaid"    style="color:#2980B9;">—</div><div class="stat-l">New Orders</div></div>
    <div class="stat-c"><div class="stat-n" id="sPrep"    style="color:#e67e22;">—</div><div class="stat-l">Preparing</div></div>
    <div class="stat-c"><div class="stat-n" id="sReady"   style="color:#27AE60;">—</div><div class="stat-l">Ready</div></div>
    <div class="stat-c"><div class="stat-n" id="sCollect" style="color:#93B1B5;">—</div><div class="stat-l">Collected</div></div>
    <div class="stat-c"><div class="stat-n" id="sRevenue" style="color:#27AE60;">—</div><div class="stat-l">Revenue ₹</div></div>
  </div>
  <div id="queueBoard" class="queue-board">
    <div style="color:#93B1B5;font-size:13px;">Loading orders…</div>
  </div>
</div>

<!-- MANAGE MENU -->
<div id="v-menu" class="sec">
  <div class="admin-hdr">
    <div class="admin-hdr-t">🍽️ Manage Menu</div>
    <div style="display:flex;gap:8px;">
      <button class="btn-p" style="font-size:11px;padding:7px 14px;background:#1A3A40;" onclick="seedMenu()">🌱 Seed Default Menu</button>
      <button class="btn-p" style="font-size:11px;padding:7px 14px;" onclick="showAddItem()">+ Add Item</button>
    </div>
  </div>
  <div id="menuAdminList"><div style="color:#93B1B5;font-size:13px;">Loading…</div></div>
</div>

<!-- ORDER HISTORY -->
<div id="v-history" class="sec">
  <div class="admin-hdr">
    <div class="admin-hdr-t">📊 Order History</div>
    <input type="date" id="histDate" onchange="loadHistory()" style="background:#1A3A40;border:1px solid rgba(184,227,233,.2);color:#D0EEF2;padding:6px 10px;border-radius:8px;font-size:12px;"/>
  </div>
  <div id="historyList"><div style="color:#93B1B5;font-size:13px;">Select a date above.</div></div>
</div>

</div></div></div>

<!-- ADD ITEM MODAL -->
<div id="addItemModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:20px;">
  <div style="background:#0B2E33;border:1px solid rgba(184,227,233,.15);border-radius:16px;padding:28px;max-width:420px;width:100%;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h3 style="color:#D0EEF2;margin:0;" id="itemModalTitle">Add Menu Item</h3>
      <button onclick="closeAddItem()" style="background:none;border:none;color:#93B1B5;font-size:20px;cursor:pointer;">✕</button>
    </div>
    <input id="iName"  placeholder="Item name*" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(184,227,233,.2);color:#D0EEF2;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;"/>
    <select id="iCat" style="width:100%;box-sizing:border-box;background:#1A3A40;border:1px solid rgba(184,227,233,.2);color:#D0EEF2;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;">
      <option>Snacks</option><option>Drinks</option><option>Meals</option><option>Combos</option>
    </select>
    <input id="iPrice" type="number" placeholder="Price (₹)*" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(184,227,233,.2);color:#D0EEF2;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;"/>
    <input id="iEmoji" placeholder="Emoji (e.g. 🍜)" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(184,227,233,.2);color:#D0EEF2;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;"/>
    <input id="iDesc"  placeholder="Description (optional)" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(184,227,233,.2);color:#D0EEF2;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:18px;"/>
    <input type="hidden" id="iEditId"/>
    <button class="btn-p" style="width:100%;padding:11px;" onclick="saveItem()">Save Item</button>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/features.js"></script>
<script>
const user = requireAuth(['canteen_admin','campus_admin','super_admin']);
if(!user) throw new Error('not auth');

document.getElementById('tnAv').textContent=user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
document.getElementById('sbNm').textContent=user.name;

function showView(id,el){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.asb-link').forEach(l=>l.classList.remove('active'));
  document.getElementById('v-'+id).classList.add('active');
  if(el) el.classList.add('active');
  if(id==='queue') loadQueue();
  if(id==='menu')  loadMenuAdmin();
}
function toggleSidebar(){
  document.querySelector('.admin-sb').classList.toggle('open');
  document.querySelector('.sidebar-overlay').classList.toggle('active');
}

async function loadQueue(){
  try{
    const [statsData,ordersData]=await Promise.all([apiFetch('/canteen/stats'),apiFetch('/canteen/orders')]);
    const s=statsData.stats;
    document.getElementById('sTotal').textContent  =s.total;
    document.getElementById('sPaid').textContent   =s.paid;
    document.getElementById('sPrep').textContent   =s.preparing;
    document.getElementById('sReady').textContent  =s.ready;
    document.getElementById('sCollect').textContent=s.collected;
    document.getElementById('sRevenue').textContent=s.revenue;

    const orders=(ordersData.orders||[]).filter(o=>o.status!=='collected'&&o.status!=='cancelled');
    if(!orders.length){
      document.getElementById('queueBoard').innerHTML='<div style="color:#93B1B5;font-size:13px;text-align:center;padding:40px;">No active orders right now.</div>';
      return;
    }
    const colClass={paid:'col-paid',preparing:'col-preparing',ready:'col-ready'};
    const statusLabel={paid:'💳 New',preparing:'👨‍🍳 Preparing',ready:'✅ Ready!'};
    document.getElementById('queueBoard').innerHTML=orders.map(o=>{
      const ago=Math.floor((Date.now()-new Date(o.createdAt))/60000);
      const oldFlag=ago>=20?`<span style="color:#e74c3c;font-size:10px;font-weight:700;">⚠️ ${ago}m ago</span>`:`<span style="color:#93B1B5;font-size:11px;">${ago}m ago</span>`;
      const stColor=o.status==='ready'?'#27AE60':'#e67e22';
      return `<div class="q-card ${colClass[o.status]||''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
          <div class="q-token">${o.token}</div>
          <span style="background:${stColor}22;color:${stColor};border:1px solid ${stColor}44;border-radius:5px;padding:2px 8px;font-size:10px;font-weight:700;">${statusLabel[o.status]||o.status}</span>
        </div>
        <div class="q-name">${o.studentName}</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
          <span style="color:#93B1B5;font-size:11px;">${o.studentUserId}</span>
          ${oldFlag}
        </div>
        <div class="q-items">${o.items.map(i=>`<span class="q-item-pill">${i.name} ×${i.qty}</span>`).join('')}</div>
        ${o.note?`<div style="color:#93B1B5;font-size:11px;margin-bottom:8px;font-style:italic;">"${o.note}"</div>`:''}
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
          <span style="color:#93B1B5;font-size:12px;">${o.items.length} item${o.items.length!==1?'s':''}</span>
          <span style="color:#27AE60;font-weight:800;font-size:15px;">₹${o.total}</span>
        </div>
        <div class="q-btns">
          ${o.status==='paid'?`<button class="q-btn btn-prep" onclick="updateOrder('${o._id}','preparing')">👨‍🍳 Start</button>`:''}
          ${o.status==='preparing'?`<button class="q-btn btn-ready" onclick="updateOrder('${o._id}','ready')">✅ Ready</button>`:''}
          ${o.status==='ready'?`<button class="q-btn btn-collect" onclick="updateOrder('${o._id}','collected')">📦 Collected</button>`:''}
          <button class="q-btn btn-cancel" onclick="updateOrder('${o._id}','cancelled')">✕ Cancel</button>
        </div>
      </div>`;
    }).join('');
  }catch(e){ showToast('Failed: '+e.message,'error'); }
}

async function updateOrder(id,status){
  try{
    await apiFetch('/canteen/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});
    loadQueue();
    showToast('Order updated: '+status,'success');
  }catch(e){ showToast(e.message,'error'); }
}

async function loadMenuAdmin(){
  const el=document.getElementById('menuAdminList');
  try{
    const data=await apiFetch('/canteen/items');
    const items=data.items||[];
    if(!items.length){
      el.innerHTML='<div style="color:#93B1B5;text-align:center;padding:30px;">No items yet. Click "Seed Default Menu" to add the standard menu.</div>';
      return;
    }
    const cats=['Snacks','Drinks','Meals','Combos'];
    let html='';
    cats.forEach(cat=>{
      const catItems=items.filter(i=>i.category===cat);
      if(!catItems.length) return;
      html+=`<div style="margin-bottom:24px;">
        <div style="color:#1A7A82;font-size:12px;font-weight:700;letter-spacing:.5px;margin-bottom:10px;">${cat.toUpperCase()}</div>
        <div style="display:grid;gap:8px;">
          ${catItems.map(item=>`
          <div style="background:#112D32;border:1px solid rgba(184,227,233,.12);border-radius:10px;padding:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
            <span style="font-size:24px;">${item.imageEmoji||'🍽️'}</span>
            <div style="flex:1;min-width:120px;">
              <div style="color:#D0EEF2;font-weight:600;font-size:13px;">${item.name}</div>
              ${item.description?`<div style="color:#93B1B5;font-size:11px;">${item.description}</div>`:''}
            </div>
            <div style="color:#27AE60;font-weight:800;font-size:15px;">₹${item.price}</div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="color:#93B1B5;font-size:11px;">Available</span>
              <label class="tog">
                <input type="checkbox" ${item.isAvailable?'checked':''} onchange="toggleAvail('${item._id}',this.checked)"/>
                <span class="tog-sl"></span>
              </label>
            </div>
            <div style="display:flex;gap:6px;">
              <button onclick='editItem(${JSON.stringify(item).replace(/"/g,"&quot;")})' style="background:rgba(184,227,233,.08);border:1px solid rgba(184,227,233,.2);color:#93B1B5;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;">Edit</button>
              <button onclick="deleteItem('${item._id}','${item.name.replace(/'/g,"\\'")}') " style="background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.25);color:#e74c3c;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;">Delete</button>
            </div>
          </div>`).join('')}
        </div>
      </div>`;
    });
    el.innerHTML=html;
  }catch(e){ el.innerHTML=`<div style="color:#e74c3c;">${e.message}</div>`; }
}

async function toggleAvail(id,val){
  try{ await apiFetch('/canteen/items/'+id,{method:'PATCH',body:JSON.stringify({isAvailable:val})}); showToast(val?'Item enabled':'Item disabled','success'); }
  catch(e){ showToast(e.message,'error'); }
}

function showAddItem(){
  document.getElementById('iName').value='';document.getElementById('iPrice').value='';
  document.getElementById('iEmoji').value='';document.getElementById('iDesc').value='';
  document.getElementById('iEditId').value='';
  document.getElementById('itemModalTitle').textContent='Add Menu Item';
  document.getElementById('addItemModal').style.display='flex';
}
function editItem(item){
  document.getElementById('iName').value=item.name;
  document.getElementById('iCat').value=item.category;
  document.getElementById('iPrice').value=item.price;
  document.getElementById('iEmoji').value=item.imageEmoji||'';
  document.getElementById('iDesc').value=item.description||'';
  document.getElementById('iEditId').value=item._id;
  document.getElementById('itemModalTitle').textContent='Edit Item';
  document.getElementById('addItemModal').style.display='flex';
}
function closeAddItem(){ document.getElementById('addItemModal').style.display='none'; }

async function saveItem(){
  const id=document.getElementById('iEditId').value;
  const body={
    name:document.getElementById('iName').value.trim(),
    category:document.getElementById('iCat').value,
    price:+document.getElementById('iPrice').value,
    imageEmoji:document.getElementById('iEmoji').value.trim()||'🍽️',
    description:document.getElementById('iDesc').value.trim(),
  };
  if(!body.name||!body.price) return showToast('Name and price required','warning');
  try{
    if(id) await apiFetch('/canteen/items/'+id,{method:'PATCH',body:JSON.stringify(body)});
    else   await apiFetch('/canteen/items',{method:'POST',body:JSON.stringify(body)});
    closeAddItem(); loadMenuAdmin();
    showToast('Item saved!','success');
  }catch(e){ showToast(e.message,'error'); }
}

async function deleteItem(id,name){
  if(!confirm(`Delete "${name}"?`)) return;
  try{ await apiFetch('/canteen/items/'+id,{method:'DELETE'}); loadMenuAdmin(); showToast('Deleted','success'); }
  catch(e){ showToast(e.message,'error'); }
}

async function seedMenu(){
  if(!confirm('Seed the default canteen menu?')) return;
  try{ const d=await apiFetch('/canteen/items/seed',{method:'POST'}); showToast(d.message,'success'); loadMenuAdmin(); }
  catch(e){ showToast(e.message,'error'); }
}

async function loadHistory(){
  const date=document.getElementById('histDate').value;
  if(!date) return;
  const el=document.getElementById('historyList');
  el.innerHTML='<div style="color:#93B1B5;font-size:13px;">Loading…</div>';
  try{
    const data=await apiFetch('/canteen/orders?date='+date);
    const orders=data.orders||[];
    if(!orders.length){ el.innerHTML='<div style="color:#93B1B5;text-align:center;padding:30px;">No orders for this date.</div>'; return; }
    const stColors={paid:'#2980B9',preparing:'#e67e22',ready:'#27AE60',collected:'#93B1B5',cancelled:'#e74c3c'};
    el.innerHTML=`<div style="color:#27AE60;font-weight:700;margin-bottom:16px;">Revenue: ₹${data.todayRevenue||0} · ${orders.length} orders</div>`
      +orders.map(o=>`
      <div style="background:#112D32;border:1px solid rgba(184,227,233,.12);border-radius:10px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
        <div style="color:#1A7A82;font-weight:900;letter-spacing:1px;min-width:160px;">${o.token}</div>
        <div style="flex:1;">
          <div style="color:#D0EEF2;font-size:13px;">${o.studentName} (${o.studentUserId})</div>
          <div style="color:#93B1B5;font-size:11px;">${o.items.map(i=>i.name+'×'+i.qty).join(', ')}</div>
        </div>
        <span style="color:${stColors[o.status]};font-weight:700;font-size:12px;">${o.status.toUpperCase()}</span>
        <span style="color:#27AE60;font-weight:800;">₹${o.total}</span>
      </div>`).join('');
  }catch(e){ el.innerHTML=`<div style="color:#e74c3c;">${e.message}</div>`; }
}

loadQueue();
setInterval(()=>{ if(document.getElementById('v-queue').classList.contains('active')) loadQueue(); },15000);
</script>
</body></html>
