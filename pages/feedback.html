<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Feedback — Poornima's Care</title>
<link rel="stylesheet" href="../css/main.css"/>
<script>window.PC_API_URL = "https://poornima-s-care.onrender.com";</script>
<script src="../js/embed-helper.js"></script>
<style>
.tog{position:relative;display:inline-block;width:36px;height:20px;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:20px;transition:.2s;}
.tog-sl:before{content:'';position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:var(--white);border-radius:50%;transition:.2s;}
.tog input:checked+.tog-sl{background:var(--teal);}
.tog input:checked+.tog-sl:before{transform:translateX(16px);}

.star{font-size:22px;cursor:pointer;color:var(--border);transition:color .1s;}
.star.on{color:#e4a200;}
.cat-row{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.cat-name{color:var(--navy);font-weight:600;font-size:12px;display:flex;align-items:center;gap:7px;}
.stars{display:flex;gap:3px;}
.bar-bg{background:var(--border);border-radius:6px;height:7px;overflow:hidden;margin-top:5px;}
.bar-fill{height:100%;border-radius:6px;background:var(--teal);}

</style>
</head><body>
<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div class="admin-wrap">
<div class="admin-sb">
  <div class="asb-top">
    <div class="asb-logo">Poornima's <span>Care</span></div>
    <div class="asb-av" id="tnAv">—</div>
    <div class="asb-nm" id="sbNm">—</div>
    <div class="asb-id" id="sbId">—</div>
  </div>
  
  <div class="asb-sec">Feedback</div>
  <div class="asb-link active" id="nl-submit" onclick="showView('submit',this)"><span class="asb-ic">⭐</span> Give Feedback</div>
  <div class="asb-link" id="nl-analytics" onclick="showView('analytics',this);loadAnalytics()" style="display:none;"><span class="asb-ic">📊</span> Analytics</div>
  <div class="asb-sec">Navigate</div>
  <div class="asb-link" onclick="pcGoToPortalHome()"><span class="asb-ic">🏠</span> Back to Portal</div>
  <div class="asb-link" onclick="pcNavigate('suggestions.html')"><span class="asb-ic">💡</span> Suggestions</div>
  <div style="padding:14px 16px;margin-top:auto;border-top:1px solid rgba(184,227,233,.12);">
    <button class="btn-p full" style="font-size:11px;padding:8px;" onclick="signOut()">Sign Out</button>
  </div>
</div>
<div class="admin-main"><div class="page-body">
<div id="v-submit" class="sec active">
  <div class="admin-hdr"><div class="admin-hdr-t">⭐ Monthly Feedback</div></div>
  <div class="admin-body">
    <div id="alreadyBanner" class="info-box mb-3" style="display:none;">✅ You've already submitted feedback this month. You can update your ratings below.</div>
    <div id="ratingForm"></div>
    <div class="flbl mt-3">Additional Comments (optional)</div>
    <textarea id="fbComment" class="ftxt" placeholder="Your comments help us improve..."></textarea>
    <button class="btn-p full" onclick="submitFeedback()">Submit Feedback</button>
  </div>
</div>
<div id="v-analytics" class="sec">
  <div class="admin-hdr">
    <div class="admin-hdr-t">📊 Analytics</div>
    <input type="month" id="analyticsMonth" class="finp" style="width:auto;margin:0;" onchange="loadAnalytics()"/>
  </div>
  <div class="admin-body" id="analyticsContent"><div class="empty"><div class="ei">📊</div><p>Select a month above.</p></div></div>
</div>
</div></div>
</div>
<script src="../js/api.js"></script><script src="../js/features.js"></script>
<script>
const user=requireAuth(['student','academic_admin','hostel_admin','campus_admin','laundry_admin','canteen_admin','mess_admin','store_admin','super_admin','faculty','guard']);
if(!user)throw new Error('auth');
const ADMIN_ROLES=['academic_admin','hostel_admin','campus_admin','super_admin'];
const isAdmin=ADMIN_ROLES.includes(user.role);

document.getElementById('tnAv').textContent=user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
document.getElementById('sbNm').textContent=user.name;
document.getElementById('sbId').textContent=user.userId;
function toggleSidebar(){document.querySelector('.admin-sb').classList.toggle('open');document.querySelector('.sidebar-overlay').classList.toggle('active');}
function showView(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.asb-link').forEach(l=>l.classList.remove('active'));document.getElementById('v-'+id).classList.add('active');if(el)el.classList.add('active');}

if(isAdmin)document.getElementById('nl-analytics').style.display='flex';
const CATS=[
  {key:'hostel',label:'Hostel',emoji:'🏠'},{key:'mess',label:'Mess Food',emoji:'🍛'},
  {key:'academic',label:'Academic Teaching',emoji:'🎓'},{key:'canteen',label:'Canteen',emoji:'🍽️'},
  {key:'bus',label:'Bus Service',emoji:'🚌'},{key:'cleanliness',label:'Campus Cleanliness',emoji:'🧹'},
  {key:'library',label:'Library',emoji:'📚'},{key:'sports',label:'Sports Facilities',emoji:'⚽'},
  {key:'internet',label:'Internet / WiFi',emoji:'📶'},{key:'security',label:'Security',emoji:'🛡️'},
  {key:'administration',label:'Administration',emoji:'🏛️'},{key:'events',label:'Events & Clubs',emoji:'🎉'},
];
let ratings={};
function renderForm(){
  document.getElementById('ratingForm').innerHTML=CATS.map(c=>`
    <div class="cat-row">
      <div class="cat-name">${c.emoji} ${c.label}</div>
      <div class="stars" id="stars-${c.key}">
        ${[1,2,3,4,5].map(n=>`<span class="star ${ratings[c.key]>=n?'on':''}" onclick="setRating('${c.key}',${n})">★</span>`).join('')}
      </div>
    </div>`).join('');
}
function setRating(key,val){
  ratings[key]=val;
  document.querySelectorAll(`#stars-${key} .star`).forEach((s,i)=>s.classList.toggle('on',i<val));
}
async function loadMyFeedback(){
  try{
    const data=await apiFetch('/feedback/my');
    if(data.feedback){ratings={...data.feedback.ratings};document.getElementById('fbComment').value=data.feedback.comment||'';document.getElementById('alreadyBanner').style.display='block';}
    renderForm();
  }catch(e){renderForm();}
}
async function submitFeedback(){
  if(!Object.keys(ratings).length)return showToast('Rate at least one category','warning');
  try{
    await apiFetch('/feedback',{method:'POST',body:JSON.stringify({ratings,comment:document.getElementById('fbComment').value})});
    showToast('Thank you for your feedback! 🙏','success');
    document.getElementById('alreadyBanner').style.display='block';
  }catch(e){showToast(e.message,'error');}
}
async function loadAnalytics(){
  const month=document.getElementById('analyticsMonth').value;const el=document.getElementById('analyticsContent');
  if(!month)return;el.innerHTML='<div class="empty"><div class="ei">⏳</div><p>Loading…</p></div>';
  try{
    const data=await apiFetch('/feedback/analytics?month='+month);
    let html=`<div style="color:var(--muted);font-size:12px;margin-bottom:14px;">${data.totalResponses} response${data.totalResponses!==1?'s':''} for ${month}</div>`;
    html+=CATS.map(c=>{const avg=data.averages[c.key];const pct=avg?(avg/5*100):0;
      return `<div class="card mb-2"><div style="display:flex;justify-content:space-between;"><span style="font-size:12px;color:var(--navy);">${c.emoji} ${c.label}</span><span style="color:#e4a200;font-weight:700;">${avg?avg+' / 5':'No data'}</span></div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%;"></div></div></div>`;
    }).join('');
    if(data.comments&&data.comments.length){
      html+='<div class="sec-lbl mt-3 mb-2">💬 Comments</div>';
      html+=data.comments.map(c=>`<div class="card mb-2"><div style="font-size:12px;color:var(--navy);">${c.comment}</div><div style="color:var(--muted);font-size:10px;margin-top:5px;">— ${c.studentName}</div></div>`).join('');
    }
    el.innerHTML=html;
  }catch(e){el.innerHTML=`<div class="empty"><div class="ei">⚠️</div><p>${e.message}</p></div>`;}
}
document.getElementById('analyticsMonth').value=new Date().toISOString().slice(0,7);
loadMyFeedback();
</script>
</body></html>
