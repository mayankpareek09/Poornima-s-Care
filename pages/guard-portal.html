<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Guard Portal — Poornima's Care</title>
<link rel="stylesheet" href="../css/main.css"/>
<script>window.PC_API_URL = "https://poornima-s-care.onrender.com";</script>
<script src="../js/embed-helper.js"></script>
<style>
.tog{position:relative;display:inline-block;width:36px;height:20px;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:20px;transition:.2s;}
.tog-sl:before{content:'';position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
.tog input:checked+.tog-sl{background:var(--teal);}
.tog input:checked+.tog-sl:before{transform:translateX(16px);}

</style>
</head><body>
<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div class="admin-wrap">
<div class="admin-sb">
  <div class="asb-top">
    <div class="asb-logo">Poornima's <span>Care</span></div>
    <div class="asb-av" id="tnAv">—</div>
    <div class="asb-nm" id="sbNm">—</div>
    <div class="asb-id" id="sbId">—</div>
  </div>
  
  <div class="asb-sec">Gate Log</div>
  <div class="asb-link active" id="nl-newvisitor" onclick="showView('newvisitor',this)"><span class="asb-ic">➕</span> New Visitor</div>
  <div class="asb-link" id="nl-log" onclick="showView('log',this);loadLog()"><span class="asb-ic">📋</span> Today's Log</div>
  <div style="padding:14px 16px;margin-top:auto;border-top:1px solid rgba(184,227,233,.12);">
    <button class="btn-p full" style="font-size:11px;padding:8px;" onclick="signOut()">Sign Out</button>
  </div>
</div>
<div class="admin-main"><div class="page-body">
<div id="v-newvisitor" class="sec active">
  <div class="admin-hdr"><div class="admin-hdr-t">🛂 Register Visitor</div></div>
  <div class="admin-body">
    <div class="card mb-3" id="visitorFormBox">
      <div class="frow mb-2">
        <div><div class="flbl">Visitor's Full Name <span class="req">*</span></div><input class="finp" id="vName" placeholder="Full name"/></div>
        <div><div class="flbl">Mobile Number <span class="req">*</span></div><input class="finp" id="vMobile" placeholder="10-digit mobile" maxlength="10"/></div>
      </div>
      <div class="frow mb-2">
        <div><div class="flbl">Whom to Meet <span class="req">*</span></div><input class="finp" id="vWhom" placeholder="Faculty / Staff name"/></div>
        <div><div class="flbl">Vehicle No. (optional)</div><input class="finp" id="vVehicle" placeholder="e.g. RJ14AB1234"/></div>
      </div>
      <div class="flbl">Reason for Visit <span class="req">*</span></div>
      <input class="finp" id="vReason" placeholder="Purpose of visit"/>
      <button class="btn-p full" onclick="registerVisitor()">📲 Send OTP &amp; Register</button>
    </div>
    <div class="card" id="otpBox" style="display:none;border:1.5px solid var(--teal);">
      <div style="font-weight:700;color:var(--navy);margin-bottom:10px;">🔐 Enter OTP read by visitor</div>
      <div style="display:flex;gap:8px;">
        <input class="finp" id="otpInput" placeholder="6-digit OTP" maxlength="6" style="margin:0;font-family:monospace;font-size:18px;letter-spacing:4px;text-align:center;" onkeydown="if(event.key==='Enter')verifyOtp()"/>
        <button class="btn-p" onclick="verifyOtp()">Verify</button>
      </div>
      <div id="otpResult" style="margin-top:10px;display:none;"></div>
      <button onclick="resetForm()" style="margin-top:12px;background:none;border:none;color:var(--teal);font-size:12px;cursor:pointer;text-decoration:underline;">+ Register another visitor</button>
    </div>
  </div>
</div>
<div id="v-log" class="sec">
  <div class="admin-hdr">
    <div class="admin-hdr-t">📋 Visitor Log</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <input id="logSearch" class="finp" style="margin:0;width:160px;" placeholder="Search name/mobile…" oninput="loadLog()"/>
      <input type="date" id="logDate" class="finp" style="margin:0;width:auto;" onchange="loadLog()"/>
      <button class="btn-p" style="padding:8px 14px;font-size:12px;" onclick="exportCsv()">⬇ CSV</button>
    </div>
  </div>
  <div class="admin-body" id="logList"><div class="empty"><div class="ei">📋</div><p>Loading…</p></div></div>
</div>
</div></div>
</div>
<script src="../js/api.js"></script><script src="../js/features.js"></script>
<script>
const user=requireAuth(['guard','campus_admin','super_admin']);if(!user)throw new Error('auth');

document.getElementById('tnAv').textContent=user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
document.getElementById('sbNm').textContent=user.name;
document.getElementById('sbId').textContent=user.userId;
function toggleSidebar(){document.querySelector('.admin-sb').classList.toggle('open');document.querySelector('.sidebar-overlay').classList.toggle('active');}
function showView(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.asb-link').forEach(l=>l.classList.remove('active'));document.getElementById('v-'+id).classList.add('active');if(el)el.classList.add('active');}

let curVisitorId=null;
document.getElementById('logDate').value=new Date().toISOString().slice(0,10);

async function registerVisitor(){
  const vName=document.getElementById('vName').value.trim();
  const mobile=document.getElementById('vMobile').value.trim();
  const whomToMeet=document.getElementById('vWhom').value.trim();
  const reason=document.getElementById('vReason').value.trim();
  const vehicleNo=document.getElementById('vVehicle').value.trim();
  if(!vName||!mobile||!whomToMeet||!reason)return showToast('Fill all required fields','warning');
  if(mobile.length!==10)return showToast('Mobile must be 10 digits','warning');
  try{
    const data=await apiFetch('/visitors',{method:'POST',body:JSON.stringify({visitorName:vName,mobile,reason,whomToMeet,vehicleNo})});
    curVisitorId=data.visitor._id;
    document.getElementById('visitorFormBox').style.display='none';
    document.getElementById('otpBox').style.display='block';
    document.getElementById('otpResult').style.display='none';
    document.getElementById('otpInput').value='';
    showToast(data.message,'success');
  }catch(e){showToast(e.message,'error');}
}
async function verifyOtp(){
  const otp=document.getElementById('otpInput').value.trim();if(!otp)return;
  const resEl=document.getElementById('otpResult');resEl.style.display='none';
  try{
    const data=await apiFetch('/visitors/'+curVisitorId+'/verify',{method:'PATCH',body:JSON.stringify({otp})});
    resEl.className='info-box';resEl.style.borderColor='#085041';resEl.style.color='#085041';resEl.style.display='block';
    resEl.innerHTML='✅ '+data.message;
  }catch(e){
    resEl.className='info-box';resEl.style.borderColor='var(--red)';resEl.style.color='var(--red)';resEl.style.display='block';
    resEl.innerHTML='❌ '+e.message;
  }
}
function resetForm(){
  ['vName','vMobile','vWhom','vReason','vVehicle','otpInput'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('visitorFormBox').style.display='block';
  document.getElementById('otpBox').style.display='none';
}
async function loadLog(){
  const el=document.getElementById('logList');el.innerHTML='<div class="empty"><div class="ei">⏳</div><p>Loading…</p></div>';
  try{
    const date=document.getElementById('logDate').value;const q=document.getElementById('logSearch').value.trim();
    let url='/visitors?date='+date;if(q)url+='&q='+encodeURIComponent(q);
    const data=await apiFetch(url);const visitors=data.visitors||[];
    if(!visitors.length){el.innerHTML='<div class="empty"><div class="ei">🛂</div><p>No visitors logged for this date.</p></div>';return;}
    const stCls={pending_otp:'badge-inprogress',verified:'badge-resolved',checked_out:'badge-gold'};
    const stLabel={pending_otp:'⏳ Pending OTP',verified:'✅ Inside',checked_out:'🚪 Checked Out'};
    el.innerHTML=visitors.map(v=>`
      <div class="card mb-2 flex items-c gap-3" style="flex-wrap:wrap;">
        <div style="min-width:140px;"><div style="font-weight:700;color:var(--navy);">${v.visitorName}</div><div style="color:var(--muted);font-size:10px;">${v.mobile}</div></div>
        <div style="flex:1;"><div style="color:var(--teal);font-size:12px;">Meeting: <b>${v.whomToMeet}</b></div><div style="color:var(--muted);font-size:10px;">${v.reason}${v.vehicleNo?' · 🚗 '+v.vehicleNo:''}</div></div>
        <span class="badge ${stCls[v.status]||''}">${stLabel[v.status]||v.status}</span>
        <div style="color:var(--muted);font-size:10px;text-align:right;">${v.checkInTime?'In: '+new Date(v.checkInTime).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):''}${v.checkOutTime?' · Out: '+new Date(v.checkOutTime).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):''}</div>
        ${v.status==='verified'?`<button class="btn-sm" style="background:var(--teal);border-color:var(--teal);color:#fff;" onclick="checkout('${v._id}')">Check Out</button>`:''}
      </div>`).join('');
  }catch(e){el.innerHTML=`<div class="empty"><div class="ei">⚠️</div><p>${e.message}</p></div>`;}
}
async function checkout(id){try{await apiFetch('/visitors/'+id+'/checkout',{method:'PATCH'});loadLog();showToast('Visitor checked out','success');}catch(e){showToast(e.message,'error');}}
function exportCsv(){
  const date=document.getElementById('logDate').value;
  const token=localStorage.getItem('pc_token');
  fetch((window.PC_API_URL||'')+'/api/visitors/export?date='+date,{headers:{'Authorization':'Bearer '+token}})
    .then(r=>r.blob()).then(blob=>{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='visitors-'+date+'.csv';document.body.appendChild(a);a.click();a.remove();})
    .catch(()=>showToast('Export failed','error'));
}
</script>
</body></html>
