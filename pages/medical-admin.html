<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Medical Center Admin — Poornima's Care</title>
<link rel="stylesheet" href="../css/main.css"/>
<script>window.PC_API_URL = "https://poornima-s-care.onrender.com";</script>
<script src="../js/embed-helper.js"></script>
</head><body>
<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div class="admin-wrap">
<div class="admin-sb">
  <div class="asb-top">
    <div class="asb-logo">Poornima's <span>Care</span></div>
    <div class="asb-av" id="tnAv">—</div>
    <div class="asb-nm" id="sbNm">—</div>
    <div class="asb-id" id="sbId">—</div>
  </div>
  <div class="asb-sec">Medical Center</div>
  <div class="asb-link active" id="nl-pending" onclick="showView('pending',this)"><span class="asb-ic">⏳</span> Pending Requests</div>
  <div class="asb-link" id="nl-confirmed" onclick="showView('confirmed',this)"><span class="asb-ic">✅</span> Confirmed</div>
  <div class="asb-link" id="nl-all" onclick="showView('all',this)"><span class="asb-ic">📋</span> All Appointments</div>
  <div style="padding:14px 16px;margin-top:auto;border-top:1px solid rgba(184,227,233,.12);">
    <button class="btn-p full" style="font-size:11px;padding:8px;" onclick="signOut()">Sign Out</button>
  </div>
</div>
<div class="admin-main"><div class="page-body">

<div id="v-pending" class="sec active">
  <div class="admin-hdr"><div class="admin-hdr-t">⏳ Pending Requests</div></div>
  <div class="admin-body" id="pendingList"><div class="empty"><div class="ei">⏳</div><p>Loading…</p></div></div>
</div>

<div id="v-confirmed" class="sec">
  <div class="admin-hdr"><div class="admin-hdr-t">✅ Confirmed Appointments</div></div>
  <div class="admin-body" id="confirmedList"><div class="empty"><div class="ei">✅</div><p>Loading…</p></div></div>
</div>

<div id="v-all" class="sec">
  <div class="admin-hdr"><div class="admin-hdr-t">📋 All Appointments</div></div>
  <div class="admin-body" id="allList"><div class="empty"><div class="ei">📋</div><p>Loading…</p></div></div>
</div>

</div></div>
</div>

<!-- Confirm Modal -->
<div class="modal-ov" id="confirmModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('confirmModal')">✕</button>
    <div class="modal-title">Confirm Appointment</div>
    <div class="flbl">Confirmed Slot <span class="req">*</span></div>
    <input class="finp" type="datetime-local" id="cfSlot"/>
    <div class="flbl">Notes (optional)</div>
    <textarea class="ftxt" id="cfNotes" placeholder="Any notes for the student…"></textarea>
    <input type="hidden" id="cfId"/>
    <button class="btn-p full" onclick="confirmAppt()">Confirm →</button>
  </div>
</div>

<!-- Complete Modal -->
<div class="modal-ov" id="completeModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('completeModal')">✕</button>
    <div class="modal-title">Mark Visit Complete</div>
    <div class="flbl">Doctor's Notes</div>
    <textarea class="ftxt" id="cpNotes" placeholder="Diagnosis / advice / follow-up…"></textarea>
    <input type="hidden" id="cpId"/>
    <button class="btn-p full" onclick="completeAppt()">Mark Complete →</button>
  </div>
</div>

<script src="../js/api.js"></script><script src="../js/features.js"></script>
<script>
const user=requireAuth(['medical_admin']);if(!user)throw new Error('auth');
document.getElementById('tnAv').textContent=user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
document.getElementById('sbNm').textContent=user.name;
document.getElementById('sbId').textContent=user.userId+' · Medical Center';

function toggleSidebar(){document.querySelector('.admin-sb').classList.toggle('open');document.querySelector('.sidebar-overlay').classList.toggle('active');}
function showView(id,el){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.getElementById('v-'+id).classList.add('active');
  document.querySelectorAll('.asb-link').forEach(l=>l.classList.remove('active'));
  if(el)el.classList.add('active');
  if(id==='pending')loadList('pending','pendingList');
  if(id==='confirmed')loadList('confirmed','confirmedList');
  if(id==='all')loadList('','allList');
}

function renderAppts(list){
  const stColor={pending:'var(--yellow)',confirmed:'var(--teal)',completed:'var(--green)',cancelled:'var(--muted)'};
  return list.map(a=>`<div class="card mb-2">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
      <div>
        <div style="font-weight:700;color:var(--navy);">${a.studentName} <span style="font-weight:400;color:var(--muted);font-size:11px;">(${a.studentUserId})</span> ${a.urgency==='urgent'?'<span style="color:var(--red);font-weight:700;font-size:10px;">🚨 URGENT</span>':''}</div>
        <div style="font-size:12px;color:var(--teal);margin-top:2px;">${a.symptoms}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:4px;">Preferred: ${new Date(a.preferredDate).toLocaleString('en-IN')}${a.confirmedSlot?' · Confirmed: '+new Date(a.confirmedSlot).toLocaleString('en-IN'):''}</div>
        ${a.doctorNotes?`<div style="font-size:11px;color:var(--navy);margin-top:4px;">📝 ${a.doctorNotes}</div>`:''}
      </div>
      <span style="background:${stColor[a.status]}22;color:${stColor[a.status]};padding:3px 9px;border-radius:6px;font-size:10px;font-weight:700;text-transform:capitalize;flex-shrink:0;">${a.status}</span>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      ${a.status==='pending'?`<button class="btn-sm" onclick="openConfirm('${a._id}')">Confirm Slot</button><button class="btn-red" onclick="cancelAppt('${a._id}')">Cancel</button>`:''}
      ${a.status==='confirmed'?`<button class="btn-sm" onclick="openComplete('${a._id}')">Mark Complete</button><button class="btn-red" onclick="cancelAppt('${a._id}')">Cancel</button>`:''}
    </div>
  </div>`).join('');
}
async function loadList(status,elId){
  const el=document.getElementById(elId);
  try{
    const data=await apiFetch('/medical/all'+(status?'?status='+status:''));
    const list=data.appointments||[];
    el.innerHTML=list.length?renderAppts(list):'<div class="empty"><div class="ei">📋</div><p>Nothing here</p></div>';
  }catch(e){el.innerHTML=`<div class="empty"><div class="ei">⚠️</div><p>${e.message}</p></div>`;}
}
loadList('pending','pendingList');

function openConfirm(id){document.getElementById('cfId').value=id;document.getElementById('cfSlot').value='';document.getElementById('cfNotes').value='';openModal('confirmModal');}
async function confirmAppt(){
  const id=document.getElementById('cfId').value;
  const slot=document.getElementById('cfSlot').value;
  if(!slot){showToast('Pick a confirmed slot','error');return;}
  try{
    await apiFetch('/medical/'+id,{method:'PATCH',body:JSON.stringify({status:'confirmed',confirmedSlot:slot,doctorNotes:document.getElementById('cfNotes').value.trim()})});
    showToast('Confirmed ✅','success');closeModal('confirmModal');loadList('pending','pendingList');
  }catch(e){showToast(e.message,'error');}
}
function openComplete(id){document.getElementById('cpId').value=id;document.getElementById('cpNotes').value='';openModal('completeModal');}
async function completeAppt(){
  const id=document.getElementById('cpId').value;
  try{
    await apiFetch('/medical/'+id,{method:'PATCH',body:JSON.stringify({status:'completed',doctorNotes:document.getElementById('cpNotes').value.trim()})});
    showToast('Marked complete ✅','success');closeModal('completeModal');loadList('confirmed','confirmedList');
  }catch(e){showToast(e.message,'error');}
}
async function cancelAppt(id){
  if(!confirm('Cancel this appointment?'))return;
  try{await apiFetch('/medical/'+id,{method:'PATCH',body:JSON.stringify({status:'cancelled'})});showToast('Cancelled','success');loadList('pending','pendingList');loadList('confirmed','confirmedList');}
  catch(e){showToast(e.message,'error');}
}
</script>
</body></html>
