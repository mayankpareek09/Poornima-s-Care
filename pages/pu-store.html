<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PU Store — Poornima's Care</title>
<link rel="stylesheet" href="../css/main.css"/>
<script>window.PC_API_URL = "https://poornima-s-care.onrender.com";</script>
<script src="../js/embed-helper.js"></script>
<style>
.tog{position:relative;display:inline-block;width:36px;height:20px;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:20px;transition:.2s;}
.tog-sl:before{content:'';position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:var(--white);border-radius:50%;transition:.2s;}
.tog input:checked+.tog-sl{background:var(--teal);}
.tog input:checked+.tog-sl:before{transform:translateX(16px);}

.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
.prod-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .18s;}
.prod-card:hover{border-color:var(--teal);}
.prod-emoji{font-size:32px;text-align:center;}
.prod-name{color:var(--navy);font-weight:700;font-size:13px;}
.prod-desc{color:var(--muted);font-size:11px;line-height:1.4;}
.prod-price{color:var(--green);font-weight:800;font-size:14px;}
.size-pills{display:flex;flex-wrap:wrap;gap:4px;}
.sz{padding:4px 9px;border-radius:6px;border:1.5px solid var(--border);font-size:11px;color:var(--teal);cursor:pointer;background:var(--inp-bg);transition:all .15s;}
.sz:hover,.sz.sel{background:var(--teal);border-color:var(--teal);color:var(--white);}
.cart-fab{position:fixed;bottom:24px;right:24px;z-index:999;background:var(--navy);color:var(--light);border:none;border-radius:50px;padding:12px 22px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(11,46,51,.25);display:flex;align-items:center;gap:10px;}
.cart-badge{background:var(--red);color:var(--white);border-radius:50%;width:20px;height:20px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.cart-drawer{position:fixed;bottom:0;right:0;width:360px;max-width:100vw;max-height:80vh;background:var(--white);border-top:1.5px solid var(--border);border-left:1.5px solid var(--border);border-radius:16px 0 0 0;z-index:1000;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:0 0 20px;box-shadow:0 -4px 24px rgba(11,46,51,.1);}
.cart-drawer.open{transform:translateY(0);}
.cart-drw-hdr{position:sticky;top:0;background:var(--white);padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.cart-item{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--border);}
.ticket{background:var(--inp-bg);border:2px dashed var(--teal);border-radius:var(--r-lg);padding:20px;max-width:340px;margin:0 auto;text-align:center;}
.ticket-token{font-size:20px;font-weight:900;color:var(--teal);letter-spacing:2px;margin:6px 0;}
.ticket-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:3px 0;}
.ticket-row b{color:var(--navy);}
@media(max-width:600px){.prod-grid{grid-template-columns:1fr 1fr;}.cart-drawer{width:100%;border-radius:16px 16px 0 0;}}
@media(max-width:380px){.prod-grid{grid-template-columns:1fr;}}

</style>
</head><body>
<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div class="admin-wrap">
<div class="admin-sb">
  <div class="asb-top">
    <div class="asb-logo">Poornima's <span>Care</span></div>
    <div class="asb-av" id="tnAv">—</div>
    <div class="asb-nm" id="sbNm">—</div>
    <div class="asb-id" id="sbId">—</div>
  </div>
  
  <div class="asb-sec">PU Store</div>
  <div class="asb-link active" id="nl-shop" onclick="showView('shop',this)"><span class="asb-ic">🛍️</span> Shop</div>
  <div class="asb-link" id="nl-myorders" onclick="showView('myorders',this);loadMyOrders()"><span class="asb-ic">📋</span> My Orders</div>
  <div class="asb-sec">Navigate</div>
  <div class="asb-link" onclick="pcGoToPortalHome()"><span class="asb-ic">🏠</span> Back to Portal</div>
  <div class="asb-link" onclick="pcNavigate('pu-stationery.html')"><span class="asb-ic">📚</span> PU Stationery</div>
  <div style="padding:14px 16px;margin-top:auto;border-top:1px solid rgba(184,227,233,.12);">
    <button class="btn-p full" style="font-size:11px;padding:8px;" onclick="signOut()">Sign Out</button>
  </div>
</div>
<div class="admin-main">
<div class="page-body">
<div id="v-shop" class="sec active">
  <div class="admin-hdr"><div class="admin-hdr-t">🛍️ PU Store</div></div>
  <div class="admin-body">
    <div id="storeGrid" class="prod-grid"><div class="empty"><div class="ei">🛍️</div><p>Loading…</p></div></div>
  </div>
</div>
<div id="v-myorders" class="sec">
  <div class="admin-hdr"><div class="admin-hdr-t">My Orders</div><button class="btn-sec" onclick="loadMyOrders()">↻ Refresh</button></div>
  <div class="admin-body" id="myOrdersList"><div class="empty"><div class="ei">📋</div><p>Loading…</p></div></div>
</div>
</div>

<button class="cart-fab" id="cartFab" onclick="toggleCart()" style="display:none;">
  🛒 Cart <span class="cart-badge" id="cartCount">0</span>
  <span id="cartTotal" style="font-size:12px;font-weight:600;">₹0</span>
</button>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-drw-hdr">
    <span style="color:var(--navy);font-weight:700;">🛒 Your Cart</span>
    <button onclick="toggleCart()" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;">✕</button>
  </div>
  <div id="cartItemsList" style="min-height:60px;"></div>
  
  <div style="padding:14px 18px;border-top:1px solid var(--border);">
    <div style="display:flex;justify-content:space-between;align-items:center;color:var(--navy);font-weight:700;margin-bottom:14px;"><span>Total</span><span id="cartTotalBig">₹0</span></div>
    <button class="btn-p full" onclick="placeOrder()">Pay &amp; Place Order →</button>
    <p style="color:var(--muted);font-size:10px;text-align:center;margin-top:8px;">Payment is simulated — no real charge</p>
  </div>
</div>
<div id="successModal" class="modal-ov">
  <div class="modal-box" style="text-align:center;max-width:380px;">
    <div style="font-size:44px;margin-bottom:10px;">✅</div>
    <div class="modal-title">Order Placed!</div>
    <div class="modal-sub">Collect at the counter using your Order ID.</div>
    <div class="ticket" id="orderTicket"></div>
    <button class="btn-p full mt-4" onclick="closeModal('successModal')">Done</button>
  </div>
</div>
</div></div>
<script src="../js/api.js"></script><script src="../js/features.js"></script>
<script>
const user=requireAuth(['student','academic_admin','hostel_admin','campus_admin','laundry_admin','canteen_admin','mess_admin','store_admin','super_admin','faculty','guard']);
if(!user)throw new Error('auth');

document.getElementById('tnAv').textContent=user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
document.getElementById('sbNm').textContent=user.name;
document.getElementById('sbId').textContent=user.userId;
function toggleSidebar(){document.querySelector('.admin-sb').classList.toggle('open');document.querySelector('.sidebar-overlay').classList.toggle('active');}
function showView(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.asb-link').forEach(l=>l.classList.remove('active'));document.getElementById('v-'+id).classList.add('active');if(el)el.classList.add('active');}

let allItems=[],cart={},selectedSizes={};

async function loadStore(){
  try{
    const data=await apiFetch('/store/products?type=store');
    allItems=data.products||[];renderStore();
  }catch(e){document.getElementById('storeGrid').innerHTML=`<div class="empty"><div class="ei">⚠️</div><p>${e.message}</p></div>`;}
}

function renderStore(){
  if(!allItems.length){document.getElementById('storeGrid').innerHTML='<div class="empty"><div class="ei">🛍️</div><p>No products available yet.</p></div>';return;}
  document.getElementById('storeGrid').innerHTML=allItems.map(item=>{
    const isId=item.category==='ID Card';
    const unavail=!item.isAvailable;
    const inCart=Object.values(cart).filter(c=>c.item._id===item._id).reduce((s,c)=>s+c.qty,0);
    const szHtml=item.sizes&&item.sizes.length?`<div class="size-pills">${item.sizes.map(sz=>`<span class="sz ${selectedSizes[item._id]===sz?'sel':''}" onclick="selectSize('${item._id}','${sz}')">${sz}</span>`).join('')}</div>`:' ';
    return `<div class="prod-card${unavail?' ':''}">
      <div class="prod-emoji">${item.imageEmoji||'🛍️'}</div>
      <div><div class="prod-name">${item.name}</div>${item.description?`<div class="prod-desc">${item.description}</div>`:''}${isId?'<div class="info-box" style="font-size:10px;margin-top:6px;">⚠️ Requires verification</div>':''}</div>
      ${szHtml}
      <div class="prod-price">₹${item.price}</div>
      ${unavail?'<div style="color:var(--red);font-size:11px;font-weight:600;">Out of stock</div>':
        `<button class="btn-p full" style="padding:8px;font-size:12px;" onclick="addToCart('${item._id}')">+ Add to Cart</button>`}
    </div>`;
  }).join('');
}

function selectSize(itemId,size){selectedSizes[itemId]=size;renderStore();}
function addToCart(id){
  const item=allItems.find(i=>i._id===id);if(!item)return;
  if(item.sizes&&item.sizes.length&&!selectedSizes[id]){showToast('Please select a size first','warning');return;}
  const key=id+'|'+(selectedSizes[id]||'');
  if(cart[key])cart[key].qty++;
  else cart[key]={item,size:selectedSizes[id]||'',qty:1};
  updateCart();
}
function changeQty(key,delta){if(!cart[key])return;cart[key].qty+=delta;if(cart[key].qty<=0)delete cart[key];updateCart();}
  function hasIdCard(){return false;}
  function checkIdCardBox(){}
function updateCart(){
  const entries=Object.values(cart);
  const count=entries.reduce((s,e)=>s+e.qty,0);
  const total=entries.reduce((s,e)=>s+e.item.price*e.qty,0);
  document.getElementById('cartCount').textContent=count;
  document.getElementById('cartTotal').textContent='₹'+total;
  document.getElementById('cartTotalBig').textContent='₹'+total;
  document.getElementById('cartFab').style.display=count>0?'flex':'none';
  const listEl=document.getElementById('cartItemsList');
  if(!entries.length){listEl.innerHTML='<div style="padding:16px 18px;color:var(--muted);font-size:12px;text-align:center;">Cart is empty</div>';checkIdCardBox();return;}
  listEl.innerHTML=Object.entries(cart).map(([key,{item,size,qty}])=>`
    <div class="cart-item">
      <div><div style="color:var(--navy);font-size:12px;font-weight:600;">${item.imageEmoji} ${item.name}${size?' ('+size+')':''}</div><div style="color:var(--muted);font-size:11px;">₹${item.price} × ${qty}</div></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="color:var(--green);font-weight:700;">₹${item.price*qty}</span>
        <div style="display:flex;align-items:center;gap:4px;">
          <button class="btn-sm" onclick="changeQty('${key}',-1)">−</button>
          <span style="font-size:12px;font-weight:700;min-width:16px;text-align:center;">${qty}</span>
          <button class="btn-sm" onclick="changeQty('${key}',1)">+</button>
        </div>
      </div>
    </div>`).join('');
  checkIdCardBox();
}
function toggleCart(){document.getElementById('cartDrawer').classList.toggle('open');}
async function placeOrder(){
  const entries=Object.values(cart);
  if(!entries.length)return showToast('Cart is empty!','warning');
  try{
    const items=entries.map(({item,size,qty})=>(({productId:item._id,size,qty})));
    const idCardReason=hasIdCard()?(document.getElementById('idCardReason')||{}).value||'':'' ;
    const data=await apiFetch('/store/orders',{method:'POST',body:JSON.stringify({type:'store',items,idCardReason})});
    cart={};selectedSizes={};updateCart();document.getElementById('cartDrawer').classList.remove('open');
    const o=data.order;
    document.getElementById('orderTicket').innerHTML=`
      <div style="color:var(--muted);font-size:11px;">ORDER ID</div>
      <div class="ticket-token">${o.orderId}</div>
      <div class="ticket-row"><span>Name</span><b>${o.studentName}</b></div>
      <div class="ticket-row"><span>Reg No</span><b>${o.studentUserId}</b></div>
      <hr/>
      ${o.items.map(i=>`<div class="ticket-row"><span>${i.name}${i.size?' ('+i.size+')':''}</span><b>₹${i.subtotal}</b></div>`).join('')}
      <hr/>
      <div class="ticket-row" style="font-weight:700;"><span>Total Paid</span><b style="color:var(--green);">₹${o.total}</b></div>`;
    openModal('successModal');renderStore();
  }catch(e){showToast(e.message||'Order failed','error');}
}
async function loadMyOrders(){
  const el=document.getElementById('myOrdersList');
  el.innerHTML='<div class="empty"><div class="ei">⏳</div><p>Loading…</p></div>';
  try{
    const data=await apiFetch('/store/orders/my?type=store');const orders=data.orders||[];
    if(!orders.length){el.innerHTML='<div class="empty"><div class="ei">📋</div><p>No orders yet.</p></div>';return;}
    const stLabel={paid:'💳 Paid',processing:'⚙️ Processing',ready:'✅ Ready to Collect!',collected:'📦 Collected',cancelled:'❌ Cancelled'};
    const stCls={paid:'badge-inprogress',processing:'badge-inprogress',ready:'badge-resolved',collected:'badge-gold',cancelled:'badge-red'};
    el.innerHTML=orders.map(o=>`
      <div class="card mb-2">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
          <div><div style="color:var(--teal);font-weight:800;font-size:13px;letter-spacing:1px;">${o.orderId}</div>
          <div style="color:var(--muted);font-size:10px;">${new Date(o.createdAt).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>
          <span class="badge ${stCls[o.status]||''}">${stLabel[o.status]||o.status}</span>
        </div>
        ${o.idCardReason?`<div class="info-box" style="font-size:10px;margin-bottom:8px;">ID Card reason: ${o.idCardReason}</div>`:''}
        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;">${o.items.map(i=>`<span class="info-box" style="margin:0;padding:2px 8px;display:inline-block;font-size:10px;">${i.name}${i.size?' ('+i.size+')':''}</span>`).join('')}</div>
        <div style="display:flex;justify-content:space-between;"><span style="color:var(--muted);font-size:11px;">${o.items.length} item${o.items.length!==1?'s':''}</span><span style="color:var(--green);font-weight:700;">₹${o.total}</span></div>
      </div>`).join('');
  }catch(e){el.innerHTML=`<div class="empty"><div class="ei">⚠️</div><p>${e.message}</p></div>`;}
}
loadStore();
document.addEventListener('click',e=>{
  const drawer=document.getElementById('cartDrawer'),fab=document.getElementById('cartFab');
  if(drawer.classList.contains('open')&&!drawer.contains(e.target)&&!fab.contains(e.target))drawer.classList.remove('open');
});
</script>
</body></html>
